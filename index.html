ect":false},{"text":"B. Cộng đồng nghề nghiệp","correct":false},{"text":"C. Cộng đồng dân cư","correct":false},{"text":"D. Cộng đồng người","correct":true}],"lines":[]},{"id":29,"title":"Câu 29. Điền vào chỗ trống: “Cơ cấu xã hội – giai cấp là hệ thống các ..., tồn tại khách quan trong một chế độ xã hội nhất định, ...”","options":[{"text":"A. Cá nhân / tập thể","correct":false},{"text":"B. Đội ngũ / tầng lớp","correct":false},{"text":"C. Tập đoàn / lực lượng sản xuất","correct":false},{"text":"D. Giai cấp / tầng lớp","correct":true}],"lines":[]},{"id":30,"title":"Câu 30. Yếu tố nào quyết định sự liên minh giữa giai cấp công nhân, giai cấp nông dân và tầng lớp trí thức?","options":[{"text":"A. Do giai cấp công nhân mong muốn","correct":false},{"text":"B. Do có cùng một kẻ thù là giai cấp tư sản","correct":false},{"text":"C. Do giai cấp công nhân muốn trở thành giai cấp thống trị","correct":false},{"text":"D. Do có những lợi ích cơ bản thống nhất với nhau","correct":true}],"lines":[]},{"id":31,"title":"Câu 31. Những lực lượng nào sau đây là trung tâm trong cơ cấu xã hội – giai cấp ở Việt Nam trong thời kỳ quá độ lên CNXH? (Chọn 2 đáp án)","options":[{"text":"A. Nhóm người cao tuổi","correct":false},{"text":"B. Giai cấp công nhân","correct":true},{"text":"C. Nhóm tín đồ tôn giáo","correct":false},{"text":"D. Giai cấp nông dân","correct":true}],"lines":[]},{"id":32,"title":"Câu 32. Những phương hướng nào sau đây nhằm phát triển cơ cấu xã hội – giai cấp ở Việt Nam trong thời kỳ quá độ lên CNXH? (Chọn 2 đáp án)","options":[{"text":"A. Tăng dân số ở khu công nghiệp","correct":false},{"text":"B. Xây dựng và hoàn thiện chính sách xã hội tổng thể","correct":true},{"text":"C. Giảm giáo dục ở những vùng không có điều kiện kinh tế","correct":false},{"text":"D. Đẩy mạnh công nghiệp hóa, hiện đại hóa","correct":true}],"lines":[]},{"id":33,"title":"Câu 33. Kéo thả (khớp khái niệm với phát biểu về cơ cấu xã hội – giai cấp ở Việt Nam):","options":[],"lines":["Lực lượng mới trong cơ cấu xã hội – giai cấp → Đội ngũ doanh nhân","Lực lượng quan trọng trong cơ cấu xã hội – giai cấp → Đội ngũ trí thức","Giai cấp trung tâm trong cơ cấu xã hội – giai cấp → Giai cấp công nhân","Chính sách hỗ trợ cơ cấu xã hội – giai cấp → Chính sách an sinh xã hội"]},{"id":34,"title":"Câu 34. Kéo thả (vị trí, vai trò của các giai cấp, tầng lớp):","options":[],"lines":["Đội ngũ trí thức là lực lượng ______ → Sáng tạo đặc biệt","Giai cấp nông dân cùng với nông nghiệp, nông thôn có vị trí ______ → Chiến lược quan trọng","Giai cấp công nhân Việt Nam có vai trò ______ → Đặc biệt quan trọng","Đội ngũ doanh nhân được Đảng ta chủ trương xây dựng thành một ______ → Đội ngũ vững mạnh"]},{"id":35,"title":"Câu 35. Chọn Đúng/Sai:","options":[],"lines":["Nội dung kinh tế là nội dung cơ bản quyết định nhất, là cơ sở vật chất kỹ thuật của liên minh. → Đúng","Tạo sức mạnh tổng hợp là mục tiêu của liên minh giai cấp, tầng lớp ở Việt Nam. → Đúng","Nội dung văn hóa không liên quan đến nội dung của liên minh giai cấp, tầng lớp. → Sai","Đổi mới hoạt động của Đảng, Nhà nước, Mặt trận Tổ quốc Việt Nam nhằm tăng cường khối liên minh giai cấp, tầng lớp ở Việt Nam. → Đúng"]},{"id":36,"title":"Câu 36. Chọn Đúng/Sai:","options":[],"lines":["Nâng cao dân trí là chính sách hỗ trợ cơ cấu xã hội – giai cấp. → Đúng","Chính sách việc làm không hỗ trợ cơ cấu xã hội – giai cấp. → Sai","Đội ngũ doanh nhân là tầng lớp mới trong cơ cấu xã hội – giai cấp. → Đúng","Cơ cấu xã hội – giai cấp ở Việt Nam không biến đổi. → Sai"]},{"id":37,"title":"Câu 37. Những chính sách nào sau đây hỗ trợ xây dựng cơ cấu xã hội – giai cấp ở Việt Nam? (Chọn 2 đáp án)","options":[{"text":"A. Ưu tiên phát triển những giai cấp lớn trong xã hội","correct":false},{"text":"B. Giải quyết tốt các mâu thuẫn, các khác biệt trong các giai cấp, tầng lớp","correct":true},{"text":"C. Thúc đẩy phát triển các tổ chức tín ngưỡng, tôn giáo","correct":false},{"text":"D. Phát huy sự thống nhất trong các giai cấp, tầng lớp, tạo sự đồng thuận xã hội","correct":true}],"lines":[]},{"id":38,"title":"Câu 38. Kéo thả các yếu tố vào cột tương ứng:","options":[],"lines":["Giai cấp/tầng lớp trong cơ cấu xã hội: Đội ngũ trí thức; Giai cấp nông dân; Giai cấp công nhân","Chính sách hỗ trợ: Bảo vệ quyền lợi; Nâng cao dân trí; Chính sách an sinh xã hội; Phát triển nông thôn mới"]},{"id":39,"title":"Câu 39. Chọn Đúng/Sai:","options":[],"lines":["Chính sách tôn giáo là chính sách chính hỗ trợ cơ cấu xã hội – giai cấp. → Sai","Đội ngũ trí thức đóng vai trò quan trọng trong cơ cấu xã hội – giai cấp. → Đúng","Giai cấp công nhân là trung tâm trong cơ cấu xã hội – giai cấp ở Việt Nam. → Đúng","Tầng lớp phụ nữ không tham gia cơ cấu xã hội – giai cấp. → Sai"]},{"id":40,"title":"Câu 40. Kéo thả các yếu tố liên quan đến liên minh giai cấp, tầng lớp vào các cột tương ứng:","options":[],"lines":["Nội dung/phương hướng của liên minh: Xóa đói giảm nghèo; Nội dung kinh tế; Tăng cường liên minh; Nội dung chính trị","Thành phần/yếu tố của liên minh: Giai cấp nông dân; Giai cấp công nhân; Tầng lớp phụ nữ; Đảng Cộng sản"]}],"notes":[]},{"id":5,"name":"Bài 5 – Vấn đề dân tộc và tôn giáo","questions":[{"id":1,"title":"Câu 1. Dân tộc hiểu theo nghĩa hẹp là:","options":[{"text":"A. Tộc người","correct":true},{"text":"B. Quốc gia dân tộc","correct":false},{"text":"C. Bộ lạc","correct":false},{"text":"D. Bộ tộc","correct":false}],"lines":[]},{"id":2,"title":"Câu 2. Đâu là đặc trưng quan trọng nhất, là cơ sở để liên kết các thành viên của dân tộc tạo thành nền tảng vững chắc của cộng đồng dân tộc?","options":[{"text":"A. Có thể cư trú tập trung trên một vùng lãnh thổ của một quốc gia, hoặc cư trú đan xen với nhiều dân tộc anh em","correct":false},{"text":"B. Có chung một phương thức sinh hoạt kinh tế","correct":true},{"text":"C. Có ngôn ngữ riêng và có thể có chữ viết riêng làm công cụ giao tiếp","correct":false},{"text":"D. Có nét tâm lý riêng (nét tâm lý dân tộc) biểu hiện kết tinh trong nền văn hoá dân tộc và tạo thành bản sắc văn hoá của dân tộc","correct":false}],"lines":[]},{"id":3,"title":"Câu 3. Thứ tự quá trình phát triển của dân tộc lần lượt trải qua các hình thức nào?","options":[{"text":"A. Bộ tộc, thị tộc, bộ lạc, dân tộc","correct":false},{"text":"B. Thị tộc, bộ lạc, bộ tộc, dân tộc","correct":true},{"text":"C. Thị tộc, bộ tộc, bộ lạc, dân tộc","correct":false},{"text":"D. Bộ lạc, bộ tộc, thị tộc, dân tộc","correct":false}],"lines":[]},{"id":4,"title":"Câu 4. Theo chủ nghĩa Mác – Lênin, nguyên nhân nào dẫn đến các cộng đồng dân cư muốn tách ra để hình thành cộng đồng dân tộc độc lập?","options":[{"text":"A. Do sự thức tỉnh, sự trưởng thành về ý thức dân tộc, ý thức về quyền sống của mình","correct":true},{"text":"B. Do các cộng đồng dân cư muốn độc lập để có thể đi xâm chiếm các dân tộc khác","correct":false},{"text":"C. Do chủ nghĩa tư bản đã phát triển thành chủ nghĩa đế quốc","correct":false},{"text":"D. Do các cộng đồng dân cư muốn phân chia lại thị trường thế giới","correct":false}],"lines":[]},{"id":5,"title":"Câu 5. Tôn giáo là một phạm trù thuộc:","options":[{"text":"A. Hình thái ý thức xã hội","correct":true},{"text":"B. Tồn tại xã hội","correct":false},{"text":"C. Cơ sở hạ tầng","correct":false},{"text":"D. Kiến trúc thượng tầng","correct":false}],"lines":[]},{"id":6,"title":"Câu 6. Tôn giáo là sản phẩm của ai?","options":[{"text":"A. Thượng đế","correct":false},{"text":"B. Các thần linh","correct":false},{"text":"C. Lực lượng siêu nhiên","correct":false},{"text":"D. Con người","correct":true}],"lines":[]},{"id":7,"title":"Câu 7. Tôn giáo khác với tín ngưỡng ở điểm nào?","options":[{"text":"A. Tín ngưỡng tôn giáo ra đời từ rất sớm","correct":false},{"text":"B. Tín ngưỡng tôn giáo có hệ thống giáo lý, giáo luật, có tổ chức và các nghi lễ chặt chẽ","correct":true},{"text":"C. Tín ngưỡng tôn giáo có số lượng tín đồ đông","correct":false},{"text":"D. Tín ngưỡng tôn giáo tồn tại ở tất cả các quốc gia trên thế giới","correct":false}],"lines":[]},{"id":8,"title":"Câu 8. Đâu là sự giống nhau giữa tôn giáo và tín ngưỡng?","options":[{"text":"A. Đều có hệ thống kinh điển","correct":false},{"text":"B. Đều có giáo chủ","correct":false},{"text":"C. Đều có niềm tin vào đấng siêu nhiên","correct":true},{"text":"D. Đều có các giáo sĩ","correct":false}],"lines":[]},{"id":9,"title":"Câu 9. Về phương diện thế giới quan, tôn giáo mang bản chất:","options":[{"text":"A. Thế giới quan duy tâm","correct":true},{"text":"B. Thế giới quan duy vật","correct":false},{"text":"C. Thế giới quan siêu hình","correct":false},{"text":"D. Thế giới quan biện chứng","correct":false}],"lines":[]},{"id":10,"title":"Câu 10. Tôn giáo ra đời từ những nguồn gốc cơ bản nào?","options":[{"text":"A. Có nguồn gốc do chủ nghĩa tư bản tạo ra","correct":false},{"text":"B. Có nguồn gốc do lực lượng siêu nhiên tạo ra","correct":false},{"text":"C. Có nguồn gốc tự nhiên, kinh tế - xã hội, tâm lý, nhận thức","correct":true},{"text":"D. Có nguồn gốc do thượng đế tạo ra","correct":false}],"lines":[]},{"id":11,"title":"Câu 11. Tìm đáp án sai về nguồn gốc hình thành của tôn giáo:","options":[{"text":"A. Nguồn gốc nhân tạo","correct":true},{"text":"B. Nguồn gốc nhận thức","correct":false},{"text":"C. Nguồn gốc tâm lý","correct":false},{"text":"D. Nguồn gốc kinh tế - xã hội","correct":false}],"lines":[]},{"id":12,"title":"Câu 12. Theo chủ nghĩa Mác – Lênin, xét đến cùng nhân tố quyết định sự tồn tại và phát triển của các hình thái ý thức xã hội, trong đó có tôn giáo là gì?","options":[{"text":"A. Các hoạt động văn hoá","correct":false},{"text":"B. Các hoạt động chính trị và quan hệ chính trị","correct":false},{"text":"C. Các cuộc cách mạng","correct":false},{"text":"D. Sản xuất vật chất và các quan hệ kinh tế","correct":true}],"lines":[]},{"id":13,"title":"Câu 13. Luận điểm nổi tiếng: \"Tôn giáo là tiếng thở dài của chúng sinh bị áp bức, là trái tim của thế giới không có trái tim... Tôn giáo là thuốc phiện của nhân dân\" là của ai?","options":[{"text":"A. C. Mác","correct":true},{"text":"B. Hồ Chí Minh","correct":false},{"text":"C. V.I. Lênin","correct":false},{"text":"D. Ph. Ăngghen","correct":false}],"lines":[]},{"id":14,"title":"Câu 14. Tại sao ngày nay khoa học đã phát triển rất mạnh mẽ mà tôn giáo vẫn có xu hướng phát triển? (Chọn 2 đáp án)","options":[{"text":"A. Do xã hội có xu hướng phát triển ngày càng tụt lùi","correct":false},{"text":"B. Do lực lượng siêu nhiên thúc đẩy","correct":false},{"text":"C. Do nhận thức của con người về tự nhiên, về xã hội và về chính bản thân mình còn có giới hạn","correct":true},{"text":"D. Do thế giới mà con người đang sống vẫn còn vô vàn điều bí ẩn mà khoa học chưa hiểu rõ bản chất của nó","correct":true}],"lines":[]},{"id":15,"title":"Câu 15. Ở Việt Nam hiện nay có khoảng bao nhiêu dân tộc?","options":[{"text":"A. 50","correct":false},{"text":"B. 45","correct":false},{"text":"C. 54","correct":true},{"text":"D. 63","correct":false}],"lines":[]},{"id":16,"title":"Câu 16. Tìm đáp án sai về đặc điểm dân tộc ở Việt Nam:","options":[{"text":"A. Các dân tộc thiểu số ở Việt Nam phân bố chủ yếu ở địa bàn có vị trí chiến lược quan trọng","correct":false},{"text":"B. Có sự chênh lệch về số dân giữa các tộc người","correct":false},{"text":"C. Các dân tộc ở Việt Nam có trình độ phát triển không đều","correct":false},{"text":"D. Các dân tộc cư trú tập trung tại các trung tâm lớn","correct":true}],"lines":[]},{"id":17,"title":"Câu 17. Vận dụng kiến thức về đặc điểm tôn giáo ở Việt Nam, hãy xác định số lượng tôn giáo đã được công nhận và cấp đăng ký hoạt động ở Việt Nam:","options":[{"text":"A. 5","correct":false},{"text":"B. 43","correct":false},{"text":"C. 13","correct":false},{"text":"D. 16","correct":true}],"lines":[]},{"id":18,"title":"Câu 18. Tại sao các tôn giáo ở Việt Nam luôn đồng hành cùng dân tộc và có nhiều đóng góp quan trọng trong quá trình xây dựng và bảo vệ đất nước?","options":[{"text":"A. Vì đa số các tín đồ là nhân dân lao động có lòng yêu nước, chống giặc ngoại xâm","correct":true},{"text":"B. Vì các tôn giáo có quan hệ với các tổ chức nước ngoài","correct":false},{"text":"C. Vì các tôn giáo có vai trò quyết định đến những vấn đề quan trọng của xã hội","correct":false},{"text":"D. Vì các tôn giáo thường bị lợi dụng bởi các thế lực phản động","correct":false}],"lines":[]},{"id":19,"title":"Câu 19. Hiểu theo nghĩa rộng, dân tộc là:","options":[{"text":"A. Quốc gia","correct":true},{"text":"B. Bộ tộc","correct":false},{"text":"C. Tộc người","correct":false},{"text":"D. Thị tộc","correct":false}],"lines":[]},{"id":20,"title":"Câu 20. Trong những nội dung của quyền dân tộc tự quyết, nội dung nào được coi là cơ bản, trước hết?","options":[{"text":"A. Quyền tự quyết về văn hoá","correct":false},{"text":"B. Quyền tự quyết về các mối quan hệ quốc tế","correct":false},{"text":"C. Quyền tự quyết về kinh tế","correct":false},{"text":"D. Quyền tự quyết về chính trị","correct":true}],"lines":[]},{"id":21,"title":"Câu 21. Đối với quốc gia và từng thành viên của dân tộc, yếu tố nào là thiêng liêng nhất mà nếu không có thì không có khái niệm tổ quốc, quốc gia?","options":[{"text":"A. Ngôn ngữ","correct":false},{"text":"B. Lãnh thổ","correct":true},{"text":"C. Kinh tế","correct":false},{"text":"D. Truyền thống văn hoá","correct":false}],"lines":[]},{"id":22,"title":"Câu 22. Vì sao Đảng, Nhà nước Việt Nam chủ trương luôn tôn trọng, bảo đảm quyền tự do tín ngưỡng tôn giáo và không tín ngưỡng tôn giáo của nhân dân?","options":[{"text":"A. Vì tín ngưỡng, tôn giáo là nhu cầu tinh thần của nhân dân","correct":true},{"text":"B. Vì lực lượng chức sắc trong các tôn giáo có tiềm lực kinh tế lớn mạnh","correct":false},{"text":"C. Vì tín ngưỡng tôn giáo được du nhập từ nước ngoài vào","correct":false},{"text":"D. Vì tín ngưỡng, tôn giáo có số lượng tín đồ đông","correct":false}],"lines":[]},{"id":23,"title":"Câu 23. Vận dụng kiến thức về vấn đề dân tộc, hãy chỉ ra điểm khác biệt cơ bản trong quá trình hình thành nên dân tộc Việt Nam so với các dân tộc khác là gì?","options":[{"text":"A. Do dân tộc Việt Nam có diện tích nhỏ","correct":false},{"text":"B. Do quá trình đồng hóa của các bộ tộc phong kiến","correct":false},{"text":"C. Do sự phát triển tiến bộ của các bộ lạc","correct":false},{"text":"D. Do yêu cầu đoàn kết của quá trình đấu tranh chống thiên tai và xâm lược","correct":true}],"lines":[]},{"id":24,"title":"Câu 24. Theo quan điểm của chủ nghĩa Mác – Lênin, để thực hiện được bình đẳng dân tộc cần phải làm gì? (Chọn 2 đáp án)","options":[{"text":"A. Phải duy trì chế độ tư hữu về tư liệu sản xuất","correct":false},{"text":"B. Thủ tiêu tình trạng áp bức giai cấp, trên cơ sở đó xoá bỏ tình trạng áp bức dân tộc","correct":true},{"text":"C. Phải liên kết với các nước đế quốc lớn","correct":false},{"text":"D. Phải đấu tranh chống chủ nghĩa phân biệt chủng tộc, chủ nghĩa sô vanh","correct":true}],"lines":[]},{"id":25,"title":"Câu 25. Quan điểm: \"Không phân biệt dân tộc lớn hay nhỏ, ở trình độ phát triển cao hay thấp, các dân tộc đều có nghĩa vụ và quyền lợi ngang nhau trên tất cả các lĩnh vực của đời sống xã hội\" thuộc nội dung nào trong Cương lĩnh dân tộc của V.I. Lênin?","options":[{"text":"A. Đoàn kết các dân tộc","correct":false},{"text":"B. Các dân tộc được quyền tự quyết","correct":false},{"text":"C. Liên hiệp công nhân tất cả các dân tộc","correct":false},{"text":"D. Các dân tộc hoàn toàn bình đẳng","correct":true}],"lines":[]},{"id":26,"title":"Câu 26. Nội dung nào vừa là nội dung chủ yếu vừa là giải pháp quan trọng để liên kết các nội dung của Cương lĩnh dân tộc thành một chỉnh thể?","options":[{"text":"A. Các dân tộc có nền phát triển kinh tế ngang nhau","correct":false},{"text":"B. Liên hiệp công nhân tất cả các dân tộc","correct":true},{"text":"C. Các dân tộc được quyền tự quyết","correct":false},{"text":"D. Các dân tộc hoàn toàn bình đẳng","correct":false}],"lines":[]},{"id":27,"title":"Câu 27. Niềm tin của con người vào các lực lượng siêu nhiên, thần thánh đến mức độ mê muội, cuồng tín, dẫn đến những hành vi cực đoan, sai lệch quá mức, trái với các giá trị văn hoá, đạo đức, pháp luật – gọi là:","options":[{"text":"A. Thờ cúng tổ tiên","correct":false},{"text":"B. Tín ngưỡng thờ Mẫu","correct":false},{"text":"C. Mê tín dị đoan","correct":true},{"text":"D. Thờ anh hùng dân tộc","correct":false}],"lines":[]},{"id":28,"title":"Câu 28. Sự sợ hãi trước những hiện tượng tự nhiên, xã hội, hay lúc ốm đau, những may rủi, bất ngờ, tâm lý muốn bình yên khi làm việc lớn... khiến con người dễ tìm đến với hình thái ý thức xã hội nào?","options":[{"text":"A. Ý thức tôn giáo","correct":true},{"text":"B. Ý thức chính trị","correct":false},{"text":"C. Ý thức pháp quyền","correct":false},{"text":"D. Ý thức thẩm mỹ","correct":false}],"lines":[]},{"id":29,"title":"Câu 29. Kéo thả các yếu tố vào các cột tương ứng:","options":[],"lines":["Đặc trưng của dân tộc: Bản sắc văn hóa dân tộc; Tâm lý dân tộc riêng; Ngôn ngữ riêng; Lãnh thổ chung","Nội dung Cương lĩnh dân tộc của Mác – Lênin: Liên hiệp công nhân tất cả các dân tộc; Các dân tộc được quyền tự quyết; Các dân tộc hoàn toàn bình đẳng"]},{"id":30,"title":"Câu 30. Kéo thả các yếu tố liên quan đến tôn giáo vào các cột tương ứng:","options":[],"lines":["Nguồn gốc của tôn giáo: Kinh tế; Nhận thức; Tâm lý","Yếu tố liên quan đến tôn giáo: Hệ thống tín đồ; Niềm tin; Cơ sở thờ tự"]},{"id":31,"title":"Câu 31. Đâu là nguồn gốc tồn tại của tôn giáo? (Chọn 2 đáp án)","options":[{"text":"A. Do các lực lượng siêu nhiên thúc đẩy","correct":false},{"text":"B. Do quy định của nhà nước","correct":false},{"text":"C. Do vẫn tồn tại đối kháng giai cấp","correct":true},{"text":"D. Do khoa học chưa giải thích hết được các hiện tượng tự nhiên và xã hội","correct":true}],"lines":[]},{"id":32,"title":"Câu 32. Kéo thả các đáp án đúng (cho sẵn: Mê tín dị đoan; Mê muội; Tôn giáo; Tín ngưỡng):","options":[],"lines":["Là sự phản ánh niềm tin mù quáng của một số người vào các lực lượng siêu nhiên. → Mê tín dị đoan","Mê tín dị đoan dẫn con người đến điều gì? → Mê muội","Là sự phản ánh một cách hoang đường, hư ảo hiện thực khách quan. → Tôn giáo","Là niềm tin và sự ngưỡng mộ của con người vào một lực lượng siêu nhiên, thần bí. → Tín ngưỡng"]},{"id":33,"title":"Câu 33. Những tầng lớp nào sau đây tham gia cơ cấu xã hội – giai cấp ở Việt Nam? (Chọn 2 đáp án; đã sửa: file 30k chọn \"Nhóm học sinh\" và \"Thanh niên\")","options":[{"text":"A. Nhóm học sinh","correct":false},{"text":"B. Phụ nữ","correct":true},{"text":"C. Thanh niên","correct":true},{"text":"D. Tín đồ tôn giáo","correct":false}],"lines":[]},{"id":34,"title":"Câu 34. Những phương hướng nào củng cố liên minh giai cấp, tầng lớp ở Việt Nam trong thời kỳ quá độ lên CNXH? (Chọn 2 đáp án)","options":[{"text":"A. Tăng vai trò tôn giáo đối với các giai cấp, tầng lớp","correct":false},{"text":"B. Giảm vai trò kinh tế trong xã hội","correct":false},{"text":"C. Tạo sự đồng thuận giữa các lực lượng","correct":true},{"text":"D. Phát huy tinh thần đoàn kết","correct":true}],"lines":[]},{"id":35,"title":"Câu 35. Chọn Đúng/Sai:","options":[],"lines":["Tôn giáo là đặc trưng chính của dân tộc quốc gia. → Sai","Dân tộc (tộc người) có ý thức tự giác tộc người. → Đúng","Tâm lý dân tộc tạo nên bản sắc văn hóa dân tộc. → Đúng","Đấu tranh chống chủ nghĩa sô-vanh là giải pháp thực hiện bình đẳng dân tộc. → Đúng"]},{"id":36,"title":"Câu 36. Chọn Đúng/Sai:","options":[],"lines":["Tôn giáo phản ánh chân thực hiện thực khách quan. → Sai","Khoa học chưa giải thích hết được các hiện tượng là lý do tôn giáo phát triển. → Đúng","Nguồn gốc nhận thức của tôn giáo là sự hạn chế hiểu biết của con người. → Đúng","Tín ngưỡng là niềm tin vào lực lượng siêu nhiên. → Đúng"]},{"id":37,"title":"Câu 37. Chọn Đúng/Sai:","options":[],"lines":["Tôn giáo không có lễ nghi bắt buộc. → Sai","Tôn trọng tự do tín ngưỡng tôn giáo là quan điểm của chủ nghĩa Mác – Lênin. → Đúng","Nguồn gốc tâm lý của tôn giáo là sợ hãi trước hiện tượng tự nhiên. → Đúng","Giáo lý chặt chẽ là đặc trưng của tôn giáo. → Đúng"]},{"id":38,"title":"Câu 38. Nội dung quyền bình đẳng dân tộc của chủ nghĩa Mác – Lênin bao gồm: (Chọn 3 đáp án)","options":[{"text":"A. Không phân biệt dân tộc lớn hay nhỏ, trình độ cao hay thấp","correct":true},{"text":"B. Các dân tộc đều có nghĩa vụ và quyền lợi ngang nhau trên tất cả các lĩnh vực của đời sống xã hội","correct":true},{"text":"C. Các dân tộc tự lựa chọn chế độ chính trị và con đường phát triển của dân tộc mình","correct":false},{"text":"D. Xóa bỏ tình trạng áp bức dân tộc","correct":true}],"lines":[]},{"id":39,"title":"Câu 39. Ghép nối các nội dung về Cương lĩnh dân tộc Mác – Lênin:","options":[],"lines":["Đây là quyền thiêng liêng của các dân tộc, không phân biệt dân tộc lớn hay nhỏ. → Quyền bình đẳng dân tộc","Yếu tố thúc đẩy bình đẳng dân tộc là gì? → Cơ sở pháp lý","Thực hiện quyền tự quyết dân tộc phải đứng vững trên lập trường của giai cấp nào? → Giai cấp công nhân","Giải pháp quan trọng để liên kết các nội dung của Cương lĩnh dân tộc thành một chỉnh thể. → Liên hiệp công nhân các dân tộc lại"]},{"id":40,"title":"Câu 40. Kéo thả (cho sẵn: Lãnh thổ; Dân tộc tộc người; Phương thức sinh hoạt kinh tế chung; Bình đẳng dân tộc):","options":[],"lines":["Đặc trưng quan trọng nhất của dân tộc là gì? → Phương thức sinh hoạt kinh tế chung","Khái niệm dân tộc theo nghĩa hẹp được gọi là gì? → Dân tộc tộc người","Nội dung cơ bản của Cương lĩnh dân tộc Mác – Lênin là gì? → Bình đẳng dân tộc","Yếu tố thiêng liêng đối với dân tộc (quốc gia) và từng thành viên dân tộc là gì? → Lãnh thổ"]},{"id":41,"title":"Câu 41. Chọn Đúng/Sai:","options":[],"lines":["Tôn giáo phản ánh hoang đường, hư ảo hiện thực khách quan. → Đúng","Mê tín dị đoan là niềm tin mù quáng cần loại bỏ. → Đúng","Tín ngưỡng có hệ thống giáo lý chặt chẽ. → Sai","Nguồn gốc kinh tế - xã hội dẫn đến sự ra đời của tôn giáo. → Đúng"]},{"id":42,"title":"Câu 42. Chọn Đúng/Sai:","options":[],"lines":["Bình đẳng dân tộc là nội dung Cương lĩnh dân tộc của Mác – Lênin. → Đúng","Dân tộc (quốc gia) không cần lãnh thổ chung. → Sai","Quyền tự quyết dân tộc bao gồm quyền phân lập thành quốc gia độc lập. → Đúng","Dân tộc là cộng đồng người có ngôn ngữ riêng và văn hóa đặc thù. → Đúng"]},{"id":43,"title":"Câu 43. Kéo thả các yếu tố vào các cột tương ứng:","options":[],"lines":["Đặc trưng của dân tộc (tộc người): Ngôn ngữ tộc người; Ý thức tự giác tộc người; Văn hóa đặc thù","Đặc trưng của dân tộc (quốc gia): Lãnh thổ chung; Tâm lý dân tộc; Ngôn ngữ chung"]},{"id":44,"title":"Câu 44. Việc thực hiện chế độ công hữu về tư liệu sản xuất chủ yếu và chế độ phân phối lợi ích theo kết quả lao động là chủ yếu là bản chất kinh tế của nền dân chủ nào?","options":[{"text":"A. Nền dân chủ xã hội chủ nghĩa","correct":true},{"text":"B. Nền dân chủ tư sản","correct":false},{"text":"C. Nền dân chủ chủ nô","correct":false},{"text":"D. Nền dân chủ nguyên thủy","correct":false}],"lines":[]},{"id":45,"title":"Câu 45. Chọn Đúng/Sai:","options":[],"lines":["Cương lĩnh dân tộc của chủ nghĩa Mác – Lênin không đề cập đến bình đẳng dân tộc. → Sai","Dân tộc (tộc người) có ngôn ngữ riêng. → Đúng","Lãnh thổ chung là đặc trưng của dân tộc quốc gia. → Đúng","Quyền tự quyết dân tộc không bao gồm quyền phân lập thành quốc gia độc lập. → Sai"]},{"id":46,"title":"Câu 46. Trong thời kỳ quá độ lên CNXH ở Việt Nam, giai cấp nào là lực lượng đi đầu thực hiện nhiệm vụ trung tâm phát triển kinh tế, tiến hành công nghiệp hóa, hiện đại hóa đất nước?","options":[{"text":"A. Giai cấp công nhân","correct":true},{"text":"B. Giai cấp nông dân","correct":false},{"text":"C. Đội ngũ trí thức","correct":false},{"text":"D. Đội ngũ doanh nhân","correct":false}],"lines":[]},{"id":47,"title":"Câu 47. Kéo thả các đáp án khớp với các phát biểu về tôn giáo, tín ngưỡng:","options":[],"lines":["Niềm tin và sự ngưỡng mộ của con người vào một lực lượng siêu nhiên, thần bí được gọi là gì? → Tín ngưỡng","Quan điểm của chủ nghĩa Mác – Lênin về tôn giáo là gì? → Tôn trọng tự do tín ngưỡng","Bản chất của tôn giáo theo chủ nghĩa Mác – Lênin là gì? → Phản ánh hư ảo các lực lượng khách quan","Chủ nghĩa Mác – Lênin coi tín ngưỡng, tôn giáo là một phạm trù thuộc hình thái nào của xã hội? → Hình thái ý thức xã hội"]},{"id":48,"title":"Câu 48. Ở Việt Nam bản chất dân chủ xã hội chủ nghĩa là dựa vào:","options":[{"text":"A. Giai cấp công nhân","correct":false},{"text":"B. Nhà nước của nhân dân, do nhân dân và vì nhân dân, dưới sự lãnh đạo của Đảng","correct":true},{"text":"C. Nhân dân","correct":false},{"text":"D. Sự quản lý của Nhà nước","correct":false}],"lines":[]},{"id":49,"title":"Câu 49. Quá trình phát triển của dân tộc trải qua mấy hình thức cộng đồng người?","options":[{"text":"A. 5","correct":false},{"text":"B. 3","correct":false},{"text":"C. 4","correct":true},{"text":"D. 2","correct":false}],"lines":[]},{"id":50,"title":"Câu 50. Lực lượng nào là lực lượng lao động sáng tạo đặc biệt quan trọng trong tiến trình đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước và hội nhập quốc tế, xây dựng kinh tế tri thức, phát triển nền văn hóa Việt Nam tiên tiến, đậm đà bản sắc dân tộc?","options":[{"text":"A. Thanh niên","correct":false},{"text":"B. Công nhân","correct":false},{"text":"C. Nông dân","correct":false},{"text":"D. Trí thức","correct":true}],"lines":[]},{"id":51,"title":"Câu 51. Những nội dung nào sau đây là nội dung cơ bản của liên minh giai cấp, tầng lớp ở Việt Nam trong thời kỳ quá độ lên CNXH? (Chọn 2 đáp án)","options":[{"text":"A. Nội dung tôn giáo","correct":false},{"text":"B. Nội dung kinh tế","correct":true},{"text":"C. Nội dung chính trị","correct":true},{"text":"D. Nội dung văn hóa","correct":false}],"lines":[]}],"notes":[]},{"id":6,"name":"Bài 6 – Vấn đề gia đình trong thời kỳ quá độ lên CNXH","questions":[{"id":1,"title":"Câu 1. Gia đình là:","options":[{"text":"A. Hình thức cộng đồng xã hội đặc biệt","correct":true},{"text":"B. Một nhóm người","correct":false},{"text":"C. Tập đoàn xã hội ổn định","correct":false},{"text":"D. Một tộc người","correct":false}],"lines":[]},{"id":2,"title":"Câu 2. Vị trí của gia đình trong xã hội là:","options":[{"text":"A. Tế bào","correct":true},{"text":"B. Bộ não","correct":false},{"text":"C. Mạch máu","correct":false},{"text":"D. Xương sống","correct":false}],"lines":[]},{"id":3,"title":"Câu 3. Hai mối quan hệ cơ bản hình thành gia đình là: (Chọn nhiều đáp án)","options":[{"text":"A. Quan hệ kinh tế","correct":false},{"text":"B. Quan hệ hôn nhân","correct":true},{"text":"C. Quan hệ huyết thống","correct":true},{"text":"D. Quan hệ quần tụ trong một không gian sinh tồn","correct":false}],"lines":[]},{"id":4,"title":"Câu 4. Quan hệ nào được coi là cơ sở, nền tảng hình thành nên các mối quan hệ khác trong gia đình?","options":[{"text":"A. Quan hệ nuôi dưỡng","correct":false},{"text":"B. Quan hệ quần tụ trong một không gian sinh tồn","correct":false},{"text":"C. Quan hệ hôn nhân và huyết thống","correct":false},{"text":"D. Quan hệ hôn nhân","correct":true}],"lines":[]},{"id":5,"title":"Câu 5. Điền vào chỗ trống: \"Hàng ngày tái tạo ra đời sống của bản thân mình, con người bắt đầu tạo ra những người khác, sinh sôi nảy nở – đó là quan hệ giữa chồng và vợ, cha mẹ và con cái, đó là ...\"","options":[{"text":"A. Tập thể","correct":false},{"text":"B. Làng xóm","correct":false},{"text":"C. Gia đình","correct":true},{"text":"D. Xã hội","correct":false}],"lines":[]},{"id":6,"title":"Câu 6. Tình yêu giữa nam và nữ trở thành quan hệ hôn nhân được thể hiện bằng:","options":[{"text":"A. Lễ đính hôn","correct":false},{"text":"B. Lễ cưới","correct":false},{"text":"C. Lời hứa giữa nam và nữ","correct":false},{"text":"D. Thủ tục pháp lý","correct":true}],"lines":[]},{"id":7,"title":"Câu 7. Chức năng của gia đình là:","options":[{"text":"A. Chức năng lãnh đạo cách mạng","correct":false},{"text":"B. Chức năng làm các hoạt động từ thiện","correct":false},{"text":"C. Chức năng kinh tế và tổ chức tiêu dùng","correct":true},{"text":"D. Chức năng tổ chức các sự kiện","correct":false}],"lines":[]},{"id":8,"title":"Câu 8. Gia đình phải thực hiện chức năng nào để đảm bảo nguồn sống, đáp ứng nhu cầu vật chất, tinh thần của các thành viên trong gia đình?","options":[{"text":"A. Chức năng kinh tế, tổ chức tiêu dùng","correct":true},{"text":"B. Chức năng thoả mãn các nhu cầu tâm sinh lý, duy trì tình cảm","correct":false},{"text":"C. Chức năng nuôi dưỡng, giáo dục","correct":false},{"text":"D. Chức năng tái sản xuất ra con người","correct":false}],"lines":[]},{"id":9,"title":"Câu 9. Chỉ ra chức năng đảm bảo tái sản xuất nguồn lao động và sức lao động cho xã hội của gia đình:","options":[{"text":"A. Chức năng nuôi dưỡng, giáo dục","correct":false},{"text":"B. Chức năng tái sản xuất ra con người","correct":true},{"text":"C. Chức năng kinh tế","correct":false},{"text":"D. Chức năng thoả mãn các nhu cầu tâm sinh lý, duy trì tình cảm","correct":false}],"lines":[]},{"id":10,"title":"Câu 10. Thực hiện chức năng nào của gia đình nhằm góp phần to lớn vào việc đào tạo thế hệ trẻ, thế hệ tương lai của xã hội?","options":[{"text":"A. Chức năng tái sản xuất ra con người","correct":false},{"text":"B. Chức năng kinh tế và tổ chức tiêu dùng","correct":false},{"text":"C. Chức năng nuôi dưỡng, giáo dục","correct":true},{"text":"D. Chức năng thỏa mãn nhu cầu tâm sinh lý, duy trì tình cảm gia đình","correct":false}],"lines":[]},{"id":11,"title":"Câu 11. Với chức năng chính trị, gia đình là:","options":[{"text":"A. Nơi lưu giữ truyền thống văn hoá của dân tộc cũng như tộc người","correct":false},{"text":"B. Cầu nối của mối quan hệ giữa nhà nước với công dân","correct":true},{"text":"C. Có trách nhiệm nuôi dưỡng, dạy dỗ con cái trở thành người có ích cho gia đình, cộng đồng và xã hội","correct":false},{"text":"D. Nơi đáp ứng nhu cầu tâm, sinh lý tự nhiên của con người, đáp ứng nhu cầu duy trì nòi giống","correct":false}],"lines":[]},{"id":12,"title":"Câu 12. So với các chế độ xã hội trước thì quan hệ gia đình trong thời kỳ quá độ lên CNXH có đặc điểm khác biệt gì về chất?","options":[{"text":"A. Duy trì quan hệ gia trưởng, độc đoán","correct":false},{"text":"B. Quan hệ bình đẳng trong gia đình, giải phóng phụ nữ","correct":true},{"text":"C. Phụ nữ chỉ lo việc nội trợ","correct":false},{"text":"D. Đàn ông là người quyết định mọi việc trong gia đình","correct":false}],"lines":[]},{"id":13,"title":"Câu 13. Quan điểm sau đây của ai: \"Nhiều gia đình cộng lại mới thành xã hội, xã hội tốt thì gia đình càng tốt, gia đình tốt thì xã hội mới tốt. Hạt nhân của xã hội chính là gia đình\"?","options":[{"text":"A. Ph. Ăngghen","correct":false},{"text":"B. V.I. Lênin","correct":false},{"text":"C. C. Mác","correct":false},{"text":"D. Hồ Chí Minh","correct":true}],"lines":[]},{"id":14,"title":"Câu 14. Gia đình Việt Nam ngày nay có thể được coi là:","options":[{"text":"A. Gia đình lạc hậu","correct":false},{"text":"B. Gia đình quá độ","correct":true},{"text":"C. Gia đình truyền thống","correct":false},{"text":"D. Gia đình hiện đại","correct":false}],"lines":[]},{"id":15,"title":"Câu 15. Xu hướng phát triển của quy mô gia đình Việt Nam ngày nay như thế nào?","options":[{"text":"A. Có xu hướng vừa tăng lên vừa thu nhỏ lại","correct":false},{"text":"B. Ngày càng được thu nhỏ lại","correct":true},{"text":"C. Có xu hướng ổn định không thay đổi so với trước đây","correct":false},{"text":"D. Ngày càng được mở rộng ra","correct":false}],"lines":[]},{"id":16,"title":"Câu 16. Sự thay đổi quy mô của gia đình hiện nay ở Việt Nam có tác động như thế nào đối với xã hội? (Chọn nhiều đáp án)","options":[{"text":"A. Không có tác động gì đối với sự phát triển của xã hội","correct":false},{"text":"B. Làm cho kinh tế của đất nước chậm phát triển","correct":false},{"text":"C. Sự bình đẳng nam nữ được đề cao hơn, cuộc sống riêng tư của con người được tôn trọng hơn","correct":true},{"text":"D. Làm cho xã hội trở nên thích nghi và phù hợp hơn với tình hình mới, thời đại mới","correct":true}],"lines":[]},{"id":17,"title":"Câu 17. Trong gia đình Việt Nam hiện đại ngày nay, nhu cầu về con cái đã có những thay đổi căn bản như thế nào?","options":[{"text":"A. Các gia đình không muốn có con để không bị gánh nặng kinh tế","correct":false},{"text":"B. Giảm mức sinh của phụ nữ, giảm số con mong muốn và giảm nhu cầu nhất thiết phải có con trai của các cặp vợ chồng","correct":true},{"text":"C. Tỷ lệ sinh thấp, nhu cầu phải có con trai tăng","correct":false},{"text":"D. Phải có con, càng đông con càng tốt và nhất thiết phải có con trai nối dõi","correct":false}],"lines":[]},{"id":18,"title":"Câu 18. Chọn đáp án sai về mô hình gia đình Việt Nam hiện đại ngày nay:","options":[{"text":"A. Người phụ nữ – người vợ làm chủ gia đình","correct":false},{"text":"B. Ông bà là người làm chủ gia đình","correct":true},{"text":"C. Người đàn ông – người chồng làm chủ gia đình","correct":false},{"text":"D. Cả hai vợ chồng cùng làm chủ gia đình","correct":false}],"lines":[]},{"id":19,"title":"Câu 19. Chức năng tái sản xuất của gia đình Việt Nam trong thời kỳ quá độ lên CNXH có những biến đổi như thế nào? (Chọn 2 đáp án)","options":[{"text":"A. Tăng nhu cầu có con trai","correct":false},{"text":"B. Chủ động trong việc sinh con","correct":true},{"text":"C. Tăng sản xuất hàng hóa","correct":false},{"text":"D. Giảm số con mong muốn","correct":true}],"lines":[]},{"id":20,"title":"Câu 20. Sự biến đổi trong việc thực hiện chức năng giáo dục của gia đình Việt Nam hiện nay là gì?","options":[{"text":"A. Chỉ giáo dục đạo đức mà không hướng tới giáo dục kiến thức khoa học hiện đại","correct":false},{"text":"B. Không hướng tới giáo dục đạo đức, lối sống","correct":false},{"text":"C. Giảm chi tiêu cho giáo dục","correct":false},{"text":"D. Sự đầu tư tài chính của gia đình cho giáo dục con cái tăng lên","correct":true}],"lines":[]},{"id":21,"title":"Câu 21. Sự biến đổi quan hệ giữa các thế hệ, các giá trị, chuẩn mực văn hoá của gia đình hạt nhân ngày nay có tác động tiêu cực như thế nào đối với người cao tuổi?","options":[{"text":"A. Người cao tuổi phải đối mặt với sự cô đơn, thiếu thốn về tình cảm","correct":true},{"text":"B. Người cao tuổi được sống trong gia đình có nhiều thế hệ","correct":false},{"text":"C. Người cao tuổi được con cái dành nhiều thời gian quan tâm, chăm sóc","correct":false},{"text":"D. Người cao tuổi được đáp ứng đầy đủ nhu cầu về tâm lý, tình cảm","correct":false}],"lines":[]},{"id":22,"title":"Câu 22. Những vấn đề xã hội nào có dấu hiệu gia tăng đối với gia đình Việt Nam trong thời kỳ quá độ lên CNXH? (Chọn 2 đáp án)","options":[{"text":"A. Giáo dục đạo đức","correct":false},{"text":"B. Sản xuất hàng hóa","correct":false},{"text":"C. Ly hôn","correct":true},{"text":"D. Bạo lực gia đình","correct":true}],"lines":[]},{"id":23,"title":"Câu 23. Quy mô của gia đình Việt Nam trong thời kỳ quá độ lên CNXH có những biến đổi như thế nào? (Chọn 2 đáp án)","options":[{"text":"A. Kinh tế tự cấp","correct":false},{"text":"B. Gia đình hạt nhân tăng lên","correct":true},{"text":"C. Quy mô lớn","correct":false},{"text":"D. Ngày càng thu nhỏ","correct":true}],"lines":[]},{"id":24,"title":"Câu 24. Chọn Đúng/Sai:","options":[],"lines":["Hiện nay, độ bền vững của gia đình không bị chi phối bởi các mối quan hệ hòa hợp tình cảm giữa chồng và vợ, cha mẹ và con cái. → Sai","Hiện nay, kinh tế gia đình đang trở thành một bộ phận quan trọng trong nền kinh tế quốc dân. → Đúng","Giáo dục gia đình tiếp tục nhấn mạnh sự hy sinh của cá nhân cho cộng đồng. → Sai","Nội dung giáo dục trong gia đình hiện nay chỉ tập trung giáo dục đạo đức. → Sai"]},{"id":25,"title":"Câu 25. Chọn Đúng/Sai:","options":[],"lines":["Trong gia đình hiện đại, sự bền vững của hôn nhân không phụ thuộc vào các yếu tố tâm lý, tình cảm, kinh tế. → Sai","Tăng số con mong muốn và tăng nhu cầu nhất thiết phải có con trai của các cặp vợ chồng. → Sai","Gia đình từ đơn vị kinh tế tự cung tự cấp sang đơn vị kinh tế hàng hoá. → Đúng","Hiện nay việc sinh đẻ được các gia đình tiến hành một cách chủ động, tự giác. → Đúng"]},{"id":26,"title":"Câu 26. Kéo thả các khái niệm khớp với các phát biểu về biến đổi gia đình Việt Nam trong thời kỳ quá độ lên CNXH:","options":[],"lines":["Biến đổi về chức năng tái sản xuất → Giảm số con","Biến đổi về quan hệ gia đình → Mâu thuẫn giữa các thế hệ","Biến đổi về quy mô gia đình → Gia đình hạt nhân","Biến đổi về chức năng kinh tế → Kinh tế hàng hóa"]},{"id":27,"title":"Câu 27. Kéo thả các yếu tố liên quan đến biến đổi gia đình Việt Nam trong thời kỳ quá độ lên CNXH vào các cột tương ứng:","options":[],"lines":["Biến đổi về chức năng gia đình: Đầu tư tài chính của gia đình cho giáo dục con cái tăng lên; Hướng đến giáo dục kiến thức khoa học hiện đại; Vai trò giáo dục của các chủ thể trong gia đình có xu hướng giảm","Biến đổi về quy mô gia đình: Gia đình đơn thân; Xu hướng thu nhỏ; Gia đình hạt nhân"]}],"notes":[]}];</script><script>const app=document.getElementById('app');let lesson,order,pos=0,answers={},revealed={},review=false;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function home(){app.innerHTML='<div class="bar"><h2>Chọn bài để bắt đầu</h2><span class="muted">'+LESSONS.reduce((n,l)=>n+l.questions.length,0)+' câu hỏi trong bộ tài liệu</span></div><div class="cards">'+LESSONS.map(l=>'<button class="card" onclick="start('+l.id+')"><span class="tag">BÀI '+l.id+' / '+l.questions.length+' CÂU</span><b>'+esc(l.name.replace(/^Bài \d+ – /,''))+'</b><span class="muted">Bắt đầu ôn tập →</span></button>').join('')+'</div>'}
function start(id){lesson=LESSONS[id-1];order=[...lesson.questions];pos=0;answers={};revealed={};review=false;render()}
function norm(s){return s.normalize('NFC').toLocaleLowerCase('vi').replace(/[.,;:!?“”"']/g,'').replace(/\s+/g,' ').trim()}
function correct(q){const a=answers[q.id];if(q.options.length){const wanted=q.options.map((o,i)=>o.correct?i:-1).filter(i=>i>=0);return wanted.length&&JSON.stringify([...(a||[])].sort())===JSON.stringify(wanted)}const pairs=q.lines.filter(t=>t.includes('→'));if(pairs.length)return pairs.every((t,i)=>norm((a||{})[i]||'')===norm(t.split('→').slice(1).join('→')));return a==='remembered'}
function pick(i){const q=order[pos];if(revealed[q.id])return;let a=answers[q.id]||[];const multi=q.options.filter(o=>o.correct).length>1;answers[q.id]=multi?(a.includes(i)?a.filter(x=>x!==i):[...a,i]):[i];render()}
function inputAnswer(i,v){const q=order[pos];answers[q.id]={...(answers[q.id]||{}),[i]:v}}
function check(){revealed[order[pos].id]=true;render()}
function move(n){pos=Math.max(0,Math.min(order.length-1,pos+n));render()}
function reorder(){order=shuffle(order);pos=0;render()}
function reset(){if(confirm('Làm lại bài này và xóa các câu trả lời hiện tại?'))start(lesson.id)}
function wrong(){const a=lesson.questions.filter(q=>revealed[q.id]&&!correct(q));if(!a.length){alert('Chưa có câu sai đã kiểm tra.');return}order=shuffle(a);for(const q of a){delete answers[q.id];delete revealed[q.id]}pos=0;review=true;render()}
function render(){const q=order[pos],a=answers[q.id],r=revealed[q.id],pairs=q.lines.filter(t=>t.includes('→')),count=lesson.questions.filter(q=>revealed[q.id]).length,score=lesson.questions.filter(q=>revealed[q.id]&&correct(q)).length;app.innerHTML='<div class="bar"><button onclick="home()">← 6 bài</button><button onclick="reorder()">⇄ Đảo câu hỏi</button><button onclick="wrong()">Ôn câu sai</button><button onclick="reset()">Làm lại bài</button></div><div class="bar"><b>'+esc(lesson.name)+'</b><span class="muted">'+score+' đúng / '+count+' đã kiểm tra</span></div><progress value="'+count+'" max="'+lesson.questions.length+'"></progress><section class="panel"><span class="tag">'+(review?'ÔN CÂU SAI · ':'')+'CÂU '+(pos+1)+' / '+order.length+' · SỐ GỐC '+q.id+'</span><h2>'+esc(q.title)+'</h2>'+(q.options.length?'<p class="muted">'+(q.options.filter(o=>o.correct).length>1?'Chọn tất cả đáp án đúng, rồi nhấn Kiểm tra.':'Chọn một đáp án, rồi nhấn Kiểm tra.')+'</p><div class="options">'+q.options.map((o,i)=>'<button class="option '+((a||[]).includes(i)?'selected ':'')+(r?(o.correct?'good':(a||[]).includes(i)?'bad':''):'')+'" onclick="pick('+i+')" '+(r?'disabled':'')+'>'+esc(o.text)+'</button>').join('')+'</div>':pairs.length?pairs.map((t,i)=>'<label>'+esc(t.split('→')[0])+'<input aria-label="Trả lời ý '+(i+1)+'" value="'+esc((a||{})[i]||'')+'" oninput="inputAnswer('+i+',this.value)" '+(r?'disabled':'')+' placeholder="Nhập đáp án (Đúng / Sai hoặc từ còn thiếu)"></label>').join(''):'<p class="muted">Câu phân loại / ghép nội dung: tự trả lời, rồi mở đáp án để đối chiếu.</p>')+'<div class="bar" style="margin-top:20px"><button class="primary" onclick="check()">'+(q.options.length||pairs.length?'Kiểm tra đáp án':'Xem đáp án')+'</button></div>'+(r?'<div class="feedback" role="status">'+(q.options.length||pairs.length?'<b>'+(correct(q)?'✓ Chính xác!':'Cần ôn lại. Đáp án theo tài liệu:')+'</b><br>':'')+(q.options.length?q.options.filter(o=>o.correct).map(o=>esc(o.text)).join('<br>'):q.lines.map(t=>esc(t)).join('<br>'))+(!q.options.length&&!pairs.length?'<div class="bar"><button onclick="selfMark(true)">Tôi đã nhớ</button><button onclick="selfMark(false)">Cần ôn lại</button></div>':'')+(pairs.length?'<p class="muted">Chấm theo nội dung nhập khớp đáp án; câu diễn đạt tương đương có thể cần tự đối chiếu.</p>':'')+'</div>':'')+'</section><div class="bar"><button onclick="move(-1)" '+(pos===0?'disabled':'')+'>← Câu trước</button><button class="primary" onclick="move(1)" '+(pos===order.length-1?'disabled':'')+'>Câu tiếp →</button><button onclick="summary()">Xem kết quả</button></div><div class="navnums">'+order.map((x,i)=>'<button class="'+(revealed[x.id]?'done ':'')+(i===pos?'current':'')+'" onclick="pos='+i+';render()" aria-label="Đến câu '+(i+1)+'">'+(i+1)+'</button>').join('')+'</div><details class="panel"><summary>Ghi chú đối chiếu và đáp án cần lưu ý trong tài liệu</summary>'+lesson.notes.map(t=>'<p>'+esc(t)+'</p>').join('')+'</details>'}
function selfMark(ok){answers[order[pos].id]=ok?'remembered':'wrong';render()}
function summary(){let checked=lesson.questions.filter(q=>revealed[q.id]),good=checked.filter(correct).length;alert('Kết quả bài '+lesson.id+'\nĐúng: '+good+'\nCần ôn lại: '+(checked.length-good)+'\nChưa kiểm tra: '+(lesson.questions.length-checked.length))}home();
</script><script>let chosenToken=null,tokenOrders={};
let optionOrders={};
let fieldOrders={};
function fieldOrder(q,m){return fieldOrders[q.id]||m.fields.map((_,i)=>i)}
function shuffleFields(){for(const q of lesson.questions){const m=questionModel(q);if(!m.fields||m.fields.length<2)continue;const before=fieldOrder(q,m);let next=shuffle(before);if(next.every((x,i)=>x===before[i]))next=[...next.slice(1),next[0]];fieldOrders[q.id]=next;}}
function optionOrder(q){return optionOrders[q.id]||q.options.map((_,i)=>i)}
function optionLabel(q,index){return String.fromCharCode(65+optionOrder(q).indexOf(index))+'. '+q.options[index].text.replace(/^[A-D]\.\s*/,'')}
reorder=function(){order=shuffle(order);for(const q of lesson.questions){if(q.options.length){const before=optionOrder(q);let next=shuffle(before);if(next.length>1&&next.every((x,i)=>x===before[i]))next=[...next.slice(1),next[0]];optionOrders[q.id]=next;}}shuffleFields();tokenOrders={};chosenToken=null;pos=0;render()};
function cleanAnswer(s){return s.replace(/\s*\((?:file|là |nhiệm kỳ)[\s\S]*$/i,'').trim()}
function questionModel(q){
  if(q.options.length)return {type:'choice'};
  const pairs=q.lines.filter(t=>t.includes('→')).map(t=>{const [prompt,...rest]=t.split('→');return {prompt:prompt.trim(),answer:cleanAnswer(rest.join('→'))}});
  if(/Đúng\s*\/\s*Sai/i.test(q.title))return {type:'boolean',fields:pairs};
  if(pairs.length){const supplied=q.title.match(/(?:đáp án cho sẵn|cho sẵn|Kéo thả)\s*:\s*(.+)/i);let bank=supplied?supplied[1].replace(/[).]+$/,'').split(';').map(s=>s.trim()).filter(Boolean):[];bank=[...new Map([...bank,...pairs.map(p=>p.answer)].map(s=>[norm(s),s])).values()];return {type:'match',fields:pairs,bank};}
  if(q.id===32&&lesson.id===1){const fields=[];for(let i=0;i<q.lines.length;i+=2)fields.push({prompt:q.lines[i],answer:q.lines[i+1]});return {type:'match',fields,bank:['giải phóng con người','giai cấp công nhân','giai cấp cách mạng','giai cấp vô sản']};}
  let groups;
  if(q.id===39&&lesson.id===1)groups=[{prompt:q.lines[0],items:q.lines.slice(2,4)},{prompt:q.lines[1],items:q.lines.slice(4)}];
  else groups=q.lines.map(t=>{const i=t.indexOf(':');return {prompt:t.slice(0,i),items:t.slice(i+1).split(';')}});
  groups=groups.map(g=>({...g,items:g.items.map(s=>s.replace(/^\s*-\s*/,'').replace(/;$/,'').trim()).filter(Boolean)}));
  return {type:'group',groups,bank:groups.flatMap(g=>g.items)};
}
function modelCorrect(q){const m=questionModel(q),a=answers[q.id]||{};if(m.type==='choice'){const wanted=q.options.map((o,i)=>o.correct?i:-1).filter(i=>i>=0);return wanted.length>0&&JSON.stringify([...(answers[q.id]||[])].sort())===JSON.stringify(wanted)}if(m.type==='group')return m.bank.every((item,i)=>Number(a[i])===m.groups.findIndex(g=>g.items.includes(item))&&a[i]!==undefined);return m.fields.every((f,i)=>norm(a[i]||'')===norm(f.answer))}
correct=modelCorrect;
function setBoolean(i,value){const q=order[pos];if(revealed[q.id])return;answers[q.id]={...(answers[q.id]||{}),[i]:value};render()}
function selectToken(i){if(revealed[order[pos].id])return;chosenToken=i;render()}
function dragToken(event,i){if(revealed[order[pos].id])return;chosenToken=i;event.dataTransfer.setData('text/plain',String(i));event.dataTransfer.effectAllowed='move'}
function allowDrop(event){if(!revealed[order[pos].id]){event.preventDefault();event.dataTransfer.dropEffect='move'}}
function dropToken(event,target){event.preventDefault();const value=event.dataTransfer.getData('text/plain');if(!/^\d+$/.test(value))return;placeToken(target,Number(value))}
function placeToken(target,index=chosenToken){const q=order[pos],m=questionModel(q);if(target<0||target>=(m.type==='group'?m.groups.length:m.fields.length)||revealed[q.id]||index===null||!Number.isInteger(index)||!m.bank[index])return;const a={...(answers[q.id]||{})};if(m.type==='group')a[index]=target;else {for(const key of Object.keys(a))if(norm(a[key])===norm(m.bank[index]))delete a[key];a[target]=m.bank[index];}answers[q.id]=a;chosenToken=null;render()}
function returnToken(event){event.preventDefault();const value=event.dataTransfer.getData('text/plain');if(!/^\d+$/.test(value))return;removeToken(Number(value))}
function removeToken(index){const q=order[pos],m=questionModel(q);if(revealed[q.id])return;const a={...(answers[q.id]||{})};if(m.type==='group')delete a[index];else for(const key of Object.keys(a))if(norm(a[key])===norm(m.bank[index]))delete a[key];answers[q.id]=a;chosenToken=null;render()}
function tokenHtml(m,i,r){return `<button type="button" class="token ${chosenToken===i?'active':''}" draggable="${!r}" ondragstart="dragToken(event,${i})" onclick="selectToken(${i})" ${r?'disabled':''}>${esc(m.bank[i])}</button>`}
function targetHtml(m,i,r,content){return `<div class="dropzone" tabindex="${r?-1:0}" role="button" aria-label="Thả đáp án vào ${esc(m.type==='group'?m.groups[i].prompt:'ý '+(i+1))}" ondragover="allowDrop(event)" ondrop="dropToken(event,${i})" onclick="if(!event.target.closest('.token'))placeToken(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();placeToken(${i})}">${content||'<span class="muted">Kéo đáp án vào đây</span>'}</div>`}
function interactiveHtml(q,m,a,r){
  if(m.type==='choice')return `<p class="muted">${q.options.filter(o=>o.correct).length>1?'Chọn tất cả đáp án đúng':'Chọn một đáp án'}, rồi nhấn Kiểm tra.</p><div class="options">${optionOrder(q).map(i=>{const o=q.options[i];return `<button class="option ${(a||[]).includes(i)?'selected ':''}${r?(o.correct?'good':(a||[]).includes(i)?'bad':''):''}" onclick="pick(${i})" ${r?'disabled':''}>${esc(optionLabel(q,i))}</button>`}).join('')}</div>`;
  if(m.type==='boolean')return `<div class="tf-list">${fieldOrder(q,m).map(i=>({f:m.fields[i],i})).map(({f,i},displayIndex)=>`<fieldset class="tf-row"><legend>${displayIndex+1}. ${esc(f.prompt)}</legend><div class="tf-choices">${['Đúng','Sai'].map(value=>`<label class="tf-choice"><input type="radio" name="tf-${q.id}-${i}" value="${value}" onchange="setBoolean(${i},this.value)" ${a?.[i]===value?'checked':''} ${r?'disabled':''}> ${value}</label>`).join('')}</div>${r?`<span class="${norm(a?.[i]||'')===norm(f.answer)?'right':'incorrect'}">Đáp án: ${esc(f.answer)}</span>`:''}</fieldset>`).join('')}</div>`;
  const key=lesson.id+'-'+q.id;if(!tokenOrders[key])tokenOrders[key]=shuffle(m.bank.map((_,i)=>i));
  const available=tokenOrders[key].filter(i=>m.type==='group'?a?.[i]===undefined:!Object.values(a||{}).some(v=>norm(v)===norm(m.bank[i])));
  const bank=`<p class="muted">Kéo thẻ đáp án vào ô tương ứng. Bạn cũng có thể chọn thẻ rồi chọn ô. Kéo thẻ về khay để bỏ đáp án.</p><div class="token-bank" ondragover="allowDrop(event)" ondrop="returnToken(event)">${available.map(i=>tokenHtml(m,i,r)).join('')||'<span class="muted">Đã đặt hết các thẻ.</span>'}</div>`;
  if(m.type==='group')return bank+`<div class="group-grid">${m.groups.map((g,i)=>`<section><h3>${esc(g.prompt)}</h3>${targetHtml(m,i,r,m.bank.map((_,j)=>a?.[j]===i?tokenHtml(m,j,r):'').join(''))}</section>`).join('')}</div>`;
  return bank+`<div class="match-list">${fieldOrder(q,m).map(i=>({f:m.fields[i],i})).map(({f,i},displayIndex)=>`<div class="match-row"><p>${displayIndex+1}. ${esc(f.prompt)}</p>${targetHtml(m,i,r,a?.[i]?tokenHtml(m,m.bank.findIndex(x=>norm(x)===norm(a[i])),r):'')}</div>`).join('')}</div>`;
}
render=function(){const q=order[pos],a=answers[q.id],r=revealed[q.id],m=questionModel(q),count=lesson.questions.filter(q=>revealed[q.id]).length,score=lesson.questions.filter(q=>revealed[q.id]&&correct(q)).length;
app.innerHTML=`<div class="bar"><button onclick="home()">← 6 bài</button><button onclick="reorder()">⇄ Đảo câu hỏi &amp; đáp án</button><button onclick="wrong()">Ôn câu sai</button><button onclick="reset()">Làm lại bài</button></div><div class="bar"><b>${esc(lesson.name)}</b><span class="muted">${score} đúng / ${count} đã kiểm tra</span></div><progress value="${count}" max="${lesson.questions.length}"></progress><section class="panel"><span class="tag">${review?'ÔN CÂU SAI · ':''}CÂU ${pos+1} / ${order.length} · SỐ GỐC ${q.id}</span><h2>${esc(q.title.replace(/^Câu\s+\d+/,'Câu '+(pos+1)))}</h2>${interactiveHtml(q,m,a,r)}<div class="bar" style="margin-top:20px"><button class="primary" onclick="check()">Kiểm tra đáp án</button></div>${r?`<div class="feedback" role="status"><b>${correct(q)?'✓ Chính xác!':'Cần ôn lại. Đáp án theo tài liệu:'}</b><br>${m.type==='choice'?optionOrder(q).filter(i=>q.options[i].correct).map(i=>esc(optionLabel(q,i))).join('<br>'):m.type==='group'?m.groups.map(g=>esc(g.prompt)+': '+g.items.map(esc).join('; ')).join('<br>'):m.fields.map(f=>esc(f.prompt)+' → '+esc(f.answer)).join('<br>')}</div>`:''}</section><div class="bar"><button onclick="move(-1)" ${pos===0?'disabled':''}>← Câu trước</button><button class="primary" onclick="move(1)" ${pos===order.length-1?'disabled':''}>Câu tiếp →</button><button onclick="summary()">Xem kết quả</button></div><div class="navnums">${order.map((x,i)=>`<button class="${revealed[x.id]?'done ':''}${i===pos?'current':''}" onclick="chosenToken=null;pos=${i};render()" aria-label="Đến câu ${i+1}">${i+1}</button>`).join('')}</div><details class="panel"><summary>Ghi chú đối chiếu và đáp án cần lưu ý trong tài liệu</summary>${lesson.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}</details>`;
};
const originalStart=start,originalMove=move;start=function(id){chosenToken=null;optionOrders={};fieldOrders={};originalStart(id)};move=function(n){chosenToken=null;originalMove(n)};
const renderWithSource=render;render=function(){renderWithSource();const q=order[pos];if(revealed[q.id]&&q.options.length&&q.lines.length){app.innerHTML=app.innerHTML.replace('</section>','<div class="feedback"><b>Ghi chú trong tài liệu</b>'+q.lines.map(t=>'<p>'+esc(t)+'</p>').join('')+'</div></section>');}};
const renderBeforeLayout=render;
render=function(){renderBeforeLayout();app.innerHTML=app.innerHTML.replace('<section class="panel">','<div class="quiz-layout"><div class="quiz-content"><section class="panel" id="question-panel">').replace(/<div class="navnums">([\s\S]*?)<\/div>/,(_,buttons)=>'</div><aside class="question-sidebar" aria-label="Danh sách câu hỏi"><h3>Danh sách câu</h3><p class="muted">Chọn số để chuyển câu</p><div class="navnums">'+buttons.replace(/onclick="chosenToken=null;pos=(\d+);render\(\)"/g,'onclick="goToQuestion($1)"')+'</div></aside></div>');};
function alignQuestion(){document.getElementById('question-panel')?.scrollIntoView?.({behavior:'smooth',block:'start'});}
function goToQuestion(index){chosenToken=null;pos=Math.max(0,Math.min(order.length-1,index));render();alignQuestion();}
move=function(n){goToQuestion(pos+n)};
</script><script>let examMode=false,examSubmitted=false;
const homeBeforeExam=home,startBeforeExam=start,renderBeforeExam=render,summaryBeforeExam=summary,resetBeforeExam=reset,checkBeforeExam=check,modelBeforeExam=questionModel;
questionModel=function(q){if(!q.sourceLesson)return modelBeforeExam(q);const saved=lesson;try{lesson={...lesson,id:q.sourceLesson};return modelBeforeExam({...q,id:q.sourceId});}finally{lesson=saved;}};
home=function(){examMode=false;homeBeforeExam();app.innerHTML='<section class="panel exam-intro"><div><span class="tag">THI THỬ TỔNG HỢP</span><h2>50 câu · Đủ 6 bài</h2><p>Lấy ngẫu nhiên 8–9 câu mỗi bài, trộn câu hỏi và đáp án. Nộp bài để xem điểm.</p></div><button class="primary" onclick="startExam()">Bắt đầu thi thử</button></section>'+app.innerHTML;};
start=function(id){examMode=false;examSubmitted=false;startBeforeExam(id);};
function startExam(){const extra=new Set(shuffle(LESSONS.map(l=>l.id)).slice(0,2));const questions=LESSONS.flatMap(l=>shuffle(l.questions).slice(0,extra.has(l.id)?9:8).map(q=>({...q,id:l.id*1000+q.id,sourceId:q.id,sourceLesson:l.id})));lesson={id:'exam',name:'Thi thử tổng hợp · 50 câu',questions,notes:[]};order=shuffle(questions);pos=0;answers={};revealed={};review=false;chosenToken=null;optionOrders={};fieldOrders={};tokenOrders={};for(const q of questions)if(q.options.length)optionOrders[q.id]=shuffle(q.options.map((_,i)=>i));shuffleFields();examMode=true;examSubmitted=false;render();alignQuestion();}
function answered(q){const a=answers[q.id],m=questionModel(q);if(m.type==='choice')return Array.isArray(a)&&a.length>0;if(m.type==='group')return m.bank.every((_,i)=>a?.[i]!==undefined);return m.fields.every((_,i)=>!!a?.[i]);}
check=function(){if(examMode&&!examSubmitted)return;checkBeforeExam();};
function submitExam(){if(examSubmitted)return;const missing=lesson.questions.filter(q=>!answered(q)).length;if(!confirm('Nộp bài thi thử?'+(missing?' Còn '+missing+' câu chưa trả lời đủ.':'')))return;examSubmitted=true;for(const q of lesson.questions)revealed[q.id]=true;render();alignQuestion();}
summary=function(){if(!examMode){summaryBeforeExam();return;}if(!examSubmitted){submitExam();return;}render();alignQuestion();};
reset=function(){if(!examMode){resetBeforeExam();return;}if(confirm('Tạo đề thi thử 50 câu mới?'))startExam();};
render=function(){renderBeforeExam();if(!examMode)return;const q=order[pos],done=lesson.questions.filter(answered).length;app.innerHTML=app.innerHTML.replace('SỐ GỐC '+q.id,'BÀI '+q.sourceLesson+' · CÂU GỐC '+q.sourceId).replace('Làm lại bài</button>','Tạo đề mới</button>').replace('Xem kết quả</button>',(examSubmitted?'Xem kết quả':'Nộp bài')+'</button>');if(!examSubmitted){app.innerHTML=app.innerHTML.replace(/<button onclick="wrong\(\)">Ôn câu sai<\/button>/,'').replace(/<button onclick="reorder\(\)">[\s\S]*?<\/button>/,'').replace(/<div class="bar" style="margin-top:20px"><button class="primary" onclick="check\(\)">Kiểm tra đáp án<\/button><\/div>/,'').replace('0 đúng / 0 đã kiểm tra',done+' / 50 câu đã trả lời đủ');app.innerHTML=app.innerHTML.replace(/(<progress value=")[^"]*/, '$1'+done);for(let i=0;i<order.length;i++)if(answered(order[i]))app.innerHTML=app.innerHTML.replace('class="'+(i===pos?'current':'')+'" onclick="goToQuestion('+i+')"','class="done '+(i===pos?'current':'')+'" onclick="goToQuestion('+i+')"');}else{const score=lesson.questions.filter(correct).length;app.innerHTML='<section class="panel" role="status"><h2>Kết quả: '+score+' / 50 câu đúng · '+(score/5).toFixed(1)+' / 10 điểm</h2><p>Mỗi câu đúng toàn bộ các ý được 0,2 điểm. Xem từng câu để đối chiếu đáp án hoặc chọn Ôn câu sai.</p></section>'+app.innerHTML;}};
home();
</script></html>
