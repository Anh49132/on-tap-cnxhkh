</style><header><small>GÓC HỌC TẬP / 6 BÀI</small><h1>Chủ nghĩa xã hội khoa học</h1><p>Ôn từng bài, đảo câu hỏi và luyện lại những câu chưa nhớ.</p></header><main id="app"></main><footer>Đáp án theo 6 tài liệu đã chuẩn hóa bạn cung cấp.</footer><script>const LESSONS=[{"id":1,"name":"Bài 1","questions":[{"id":1,"title":"Câu 1. Những nhà tư tưởng tiêu biểu của chủ nghĩa xã hội không tưởng phê phán đầu thế kỷ XIX là ai?","options":[{"text":"A. Grắccơ Babớp, Xanh Ximông, Sáclơ Phuriê","correct":false},{"text":"B. Xanh Ximông, Sáclơ Phuriê, Rôbớt Ôoen","correct":true},{"text":"C. Xanh Ximông, Giăng Mêliê, Rôbớt Ôoen","correct":false},{"text":"D. Xanh Ximông, Sáclơ Phuriê, G. Mably","correct":false}],"lines":[]},{"id":2,"title":"Câu 2. Tác phẩm nào đánh dấu sự ra đời của chủ nghĩa xã hội khoa học?","options":[{"text":"A. Góp phần phê phán triết học pháp quyền của Hêghen – Lời nói đầu","correct":false},{"text":"B. Bộ Tư bản","correct":false},{"text":"C. Tình cảnh giai cấp công nhân ở Anh","correct":false},{"text":"D. Tuyên ngôn của Đảng Cộng sản","correct":true}],"lines":[]},{"id":3,"title":"Câu 3. Đối tượng nghiên cứu của chủ nghĩa xã hội khoa học là gì?","options":[{"text":"A. Là những quy luật và tính quy luật chính trị – xã hội của quá trình phát sinh, hình thành và phát triển của hình thái kinh tế – xã hội cộng sản chủ nghĩa","correct":true},{"text":"B. Là những quy luật hình thành, phát triển và hoàn thiện của các hình thái kinh tế – xã hội","correct":false},{"text":"C. Là những quy luật kinh tế","correct":false},{"text":"D. Là những quy luật văn hoá – xã hội","correct":false}],"lines":[]},{"id":4,"title":"Câu 4. Phát kiến nào của C. Mác và Ph. Ăngghen chỉ ra sự diệt vong về kinh tế của chủ nghĩa tư bản?","options":[{"text":"A. Học thuyết về sứ mệnh lịch sử toàn thế giới của giai cấp công nhân","correct":false},{"text":"B. Học thuyết về giá trị thặng dư","correct":true},{"text":"C. Chủ nghĩa duy vật lịch sử","correct":false},{"text":"D. Chủ nghĩa duy vật biện chứng","correct":false}],"lines":[]},{"id":5,"title":"Câu 5. Ph. Ăngghen đã đánh giá: \"Hai phát hiện vĩ đại này đã đưa chủ nghĩa xã hội trở thành một khoa học\". Hai phát kiến đó là gì?","options":[{"text":"A. Sứ mệnh lịch sử của giai cấp công nhân – Chủ nghĩa duy vật lịch sử","correct":false},{"text":"B. Chủ nghĩa duy vật biện chứng và chủ nghĩa duy vật lịch sử","correct":false},{"text":"C. Học thuyết giá trị thặng dư – Chủ nghĩa duy vật lịch sử","correct":true},{"text":"D. Sứ mệnh lịch sử của giai cấp công nhân – Học thuyết giá trị thặng dư","correct":false}],"lines":[]},{"id":6,"title":"Câu 6. Đâu là nhân tố chủ quan quan trọng nhất để giai cấp công nhân thực hiện thắng lợi sứ mệnh lịch sử của mình?","options":[{"text":"A. Liên minh giai cấp công nhân với giai cấp nông dân","correct":false},{"text":"B. Sự phát triển của giai cấp công nhân về số lượng","correct":false},{"text":"C. Sự phát triển của giai cấp công nhân về chất lượng","correct":false},{"text":"D. Đảng Cộng sản","correct":true}],"lines":[]},{"id":7,"title":"Câu 7. Xét trong quan hệ sản xuất tư bản chủ nghĩa, giai cấp công nhân là:","options":[{"text":"A. Giai cấp nghèo khổ nhất","correct":false},{"text":"B. Giai cấp không có tư liệu sản xuất, đi làm thuê cho nhà tư bản, bị nhà tư bản bóc lột giá trị thặng dư","correct":true},{"text":"C. Giai cấp tạo ra của cải cho xã hội","correct":false},{"text":"D. Giai cấp có số lượng đông trong dân cư","correct":false}],"lines":[]},{"id":8,"title":"Câu 8. Điền từ còn thiếu: \"Giai cấp công nhân và nhân dân lao động là cơ sở ..., cơ sở ... của Đảng Cộng sản, là nguồn bổ sung lực lượng phong phú cho Đảng.\"","options":[{"text":"A. Văn hoá – xã hội","correct":false},{"text":"B. Chính trị – xã hội","correct":false},{"text":"C. Kinh tế – xã hội","correct":false},{"text":"D. Giai cấp – xã hội","correct":true}],"lines":["Giải thích: giai cấp công nhân và nhân dân lao động là cơ sở giai cấp, cơ sở xã hội của Đảng Cộng sản."]},{"id":9,"title":"Câu 9. Giai cấp công nhân Việt Nam ra đời vào thời gian nào?","options":[{"text":"A. Trong cuộc khai thác thuộc địa lần thứ hai của thực dân Pháp","correct":false},{"text":"B. Trước khi thực dân Pháp xâm lược Việt Nam","correct":false},{"text":"C. Trong cuộc khai thác thuộc địa lần thứ nhất của thực dân Pháp","correct":true},{"text":"D. Những năm đầu thế kỷ 19","correct":false}],"lines":[]},{"id":10,"title":"Câu 10. Nội dung nào thuộc về giải pháp xây dựng giai cấp công nhân Việt Nam hiện nay?","options":[{"text":"A. Thực hiện tốt chính sách và pháp luật đối với công nhân và người lao động","correct":false},{"text":"B. Coi trọng và giữ vững bản chất giai cấp công nhân và nguyên tắc sinh hoạt Đảng","correct":false},{"text":"C. Xây dựng giai cấp công nhân lớn mạnh, có giác ngộ giai cấp và chính trị vững vàng","correct":false},{"text":"D. Thực hiện chiến lược xây dựng giai cấp công nhân lớn mạnh, gắn kết chặt chẽ với chiến lược phát triển kinh tế – xã hội, công nghiệp hóa, hiện đại hóa đất nước và hội nhập quốc tế","correct":true}],"lines":[]},{"id":11,"title":"Câu 11. Nội dung nào thuộc về giải pháp xây dựng giai cấp công nhân Việt Nam hiện nay?","options":[{"text":"A. Xây dựng giai cấp công nhân lớn mạnh, có giác ngộ giai cấp và chính trị vững vàng","correct":false},{"text":"B. Nâng cao nhận thức, kiên định quan điểm giai cấp công nhân là giai cấp lãnh đạo cách mạng thông qua đội tiền phong là Đảng Cộng sản Việt Nam","correct":true},{"text":"C. Xây dựng giai cấp công nhân tăng về số lượng và chất lượng","correct":false},{"text":"D. Coi trọng và giữ vững bản chất giai cấp công nhân và nguyên tắc sinh hoạt Đảng","correct":false}],"lines":[]},{"id":12,"title":"Câu 12. Điểm then chốt để giai cấp công nhân Việt Nam hiện nay thực hiện thành công sứ mệnh lịch sử của mình là:","options":[{"text":"A. Coi trọng công tác xây dựng, chỉnh đốn Đảng","correct":true},{"text":"B. Trí thức hóa giai cấp công nhân","correct":false},{"text":"C. Phát triển giai cấp công nhân cả về số lượng và chất lượng","correct":false},{"text":"D. Xây dựng khối liên minh công – nông","correct":false}],"lines":[]},{"id":13,"title":"Câu 13. Xét về phương thức lao động, phương thức sản xuất, giai cấp công nhân mang thuộc tính cơ bản nào?","options":[{"text":"A. Giai cấp có tư liệu sản xuất nhiều nhất","correct":false},{"text":"B. Có số lượng đông nhất trong dân cư","correct":false},{"text":"C. Là giai cấp trực tiếp hay gián tiếp vận hành máy móc có tính chất công nghiệp ngày càng hiện đại","correct":true},{"text":"D. Là giai cấp tạo ra của cải vật chất làm giàu cho xã hội","correct":false}],"lines":[]},{"id":14,"title":"Câu 14. Đặc điểm nào sau đây thể hiện đúng bản chất của giai cấp công nhân? (Chọn 2 đáp án)","options":[{"text":"A. Có tính tổ chức và kỷ luật cao trong lao động sản xuất","correct":true},{"text":"B. Có trình độ học vấn thấp, chủ yếu làm việc tay chân","correct":false},{"text":"C. Luôn gắn bó với giai cấp địa chủ và tiểu thương","correct":false},{"text":"D. Không sở hữu tư liệu sản xuất, sống bằng lao động làm thuê","correct":true}],"lines":[]},{"id":15,"title":"Câu 15. Trong thời kỳ thuộc địa, giai cấp công nhân Việt Nam chủ yếu làm việc trong: (Chọn 2 đáp án)","options":[{"text":"A. Hợp tác xã nông nghiệp","correct":false},{"text":"B. Xí nghiệp thủ công truyền thống","correct":false},{"text":"C. Nhà máy, hầm mỏ do thực dân Pháp xây dựng","correct":true},{"text":"D. Đồn điền cao su","correct":true}],"lines":[]},{"id":16,"title":"Câu 16. Phát kiến nào của C. Mác và Ph. Ăngghen chỉ ra những hạn chế có tính lịch sử của chủ nghĩa xã hội không tưởng?","options":[{"text":"A. Chủ nghĩa duy vật lịch sử","correct":false},{"text":"B. Chủ nghĩa duy vật biện chứng","correct":false},{"text":"C. Học thuyết về giá trị thặng dư","correct":false},{"text":"D. Học thuyết về sứ mệnh lịch sử toàn thế giới của giai cấp công nhân","correct":true}],"lines":[]},{"id":17,"title":"Câu 17. Phạm trù nào được coi là cơ bản nhất và là xuất phát điểm của chủ nghĩa xã hội khoa học?","options":[{"text":"A. Sứ mệnh lịch sử của giai cấp công nhân","correct":true},{"text":"B. Cách mạng xã hội chủ nghĩa","correct":false},{"text":"C. Giai cấp công nhân","correct":false},{"text":"D. Chuyên chính vô sản","correct":false}],"lines":[]},{"id":18,"title":"Câu 18. Cùng với sự phát triển của khoa học và công nghệ ngày càng hiện đại, giai cấp công nhân:","options":[{"text":"A. Tăng về số lượng và nâng cao về chất lượng","correct":true},{"text":"B. Giảm về số lượng và có trình độ sản xuất ngày càng cao","correct":false},{"text":"C. Giảm về số lượng và nâng cao về chất lượng","correct":false},{"text":"D. Tăng về số lượng và giảm về chất lượng","correct":false}],"lines":[]},{"id":19,"title":"Câu 19. Điền từ còn thiếu: \"Giai cấp công nhân Việt Nam thực hiện lãnh đạo cách mạng thông qua đội tiên phong của nó là (...).\"","options":[{"text":"A. Đảng Cộng sản Việt Nam","correct":true},{"text":"B. Tổng Liên đoàn Lao động Việt Nam","correct":false},{"text":"C. Mặt trận Tổ quốc Việt Nam","correct":false},{"text":"D. Tổ chức Công đoàn","correct":false}],"lines":[]},{"id":20,"title":"Câu 20. Nội dung trực tiếp về văn hóa – tư tưởng thể hiện sứ mệnh lịch sử của giai cấp công nhân Việt Nam là:","options":[{"text":"A. Xây dựng con người mới xã hội chủ nghĩa","correct":false},{"text":"B. Xây dựng nền giáo dục hiện đại","correct":false},{"text":"C. Xây dựng nền văn hóa Việt Nam tiên tiến, đậm đà bản sắc dân tộc","correct":true},{"text":"D. Xây dựng hệ giá trị và con người Việt Nam","correct":false}],"lines":[]},{"id":21,"title":"Câu 21. Điều kiện chủ quan để giai cấp công nhân thực hiện được sứ mệnh lịch sử của mình là: (Chọn 2 đáp án)","options":[{"text":"A. Sở hữu toàn bộ tư liệu sản xuất trong xã hội","correct":false},{"text":"B. Đảng Cộng sản","correct":true},{"text":"C. Không cần liên minh với các giai cấp, tầng lớp khác","correct":false},{"text":"D. Sự phát triển của bản thân giai cấp công nhân cả về số lượng và chất lượng","correct":true}],"lines":[]},{"id":22,"title":"Câu 22. Đặc điểm sứ mệnh lịch sử của giai cấp công nhân là:","options":[{"text":"A. Thay thế chế độ chiếm hữu nô lệ bằng chế độ xã hội chủ nghĩa","correct":false},{"text":"B. Thay thế chế độ công hữu này bằng một chế độ công hữu khác","correct":false},{"text":"C. Thay thế chế độ sở hữu tư nhân này bằng một chế độ sở hữu tư nhân khác","correct":false},{"text":"D. Xóa bỏ triệt để chế độ tư hữu về tư liệu sản xuất","correct":true}],"lines":[]},{"id":23,"title":"Câu 23. Theo C. Mác và Ph. Ăngghen, đặc điểm nổi bật của giai cấp công nhân là: (Chọn 2 đáp án)","options":[{"text":"A. Làm việc trong nông nghiệp, sử dụng công cụ thủ công","correct":false},{"text":"B. Có quyền sở hữu toàn bộ tư liệu sản xuất","correct":false},{"text":"C. Giai cấp cách mạng và có tinh thần cách mạng triệt để","correct":true},{"text":"D. Lao động bằng phương thức công nghiệp","correct":true}],"lines":[]},{"id":24,"title":"Câu 24. Giai cấp công nhân Việt Nam chủ yếu xuất thân từ tầng lớp nào? (Chọn 2 đáp án)","options":[{"text":"A. Tầng lớp địa chủ phong kiến","correct":false},{"text":"B. Giai cấp nông dân bị tước đoạt hết ruộng đất","correct":true},{"text":"C. Thợ thủ công bị phá sản","correct":true},{"text":"D. Tầng lớp tư sản dân tộc","correct":false}],"lines":[]},{"id":25,"title":"Câu 25. Hạn chế cơ bản lớn nhất mà giai cấp công nhân Việt Nam hiện nay cần khắc phục là gì?","options":[{"text":"A. Trình độ khoa học kỹ thuật chưa cao","correct":true},{"text":"B. Hiệu quả lao động thấp","correct":false},{"text":"C. Số lượng còn ít","correct":false},{"text":"D. Tâm lý tiểu nông","correct":false}],"lines":[]},{"id":26,"title":"Câu 26. Nội dung nào thuộc về giải pháp xây dựng giai cấp công nhân Việt Nam hiện nay?","options":[{"text":"A. Thực hiện tốt chính sách và pháp luật đối với công nhân và người lao động","correct":false},{"text":"B. Coi trọng và giữ vững bản chất giai cấp công nhân và nguyên tắc sinh hoạt Đảng","correct":false},{"text":"C. Thực hiện chiến lược xây dựng giai cấp công nhân lớn mạnh, gắn kết chặt chẽ với chiến lược phát triển kinh tế – xã hội, công nghiệp hóa, hiện đại hóa đất nước, hội nhập quốc tế","correct":true},{"text":"D. Xây dựng giai cấp công nhân lớn mạnh, có giác ngộ giai cấp và chính trị vững vàng","correct":false}],"lines":[]},{"id":27,"title":"Câu 27. Vấn đề nổi bật đối với việc thực hiện sứ mệnh lịch sử của giai cấp công nhân Việt Nam hiện nay là gì?","options":[{"text":"A. Tham gia xây dựng nền kinh tế thị trường định hướng xã hội chủ nghĩa","correct":false},{"text":"B. Nắm vững khoa học và công nghệ","correct":false},{"text":"C. Phát huy vai trò và trách nhiệm của lực lượng đi đầu trong sự nghiệp đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước","correct":true},{"text":"D. Lực lượng chủ đạo trong lao động","correct":false}],"lines":[]},{"id":28,"title":"Câu 28. Theo Ph. Ăngghen: \"Thực hiện nhiệm vụ giải phóng thế giới ấy, đó là sứ mệnh lịch sử của…\"","options":[{"text":"A. Giai cấp vô sản","correct":true},{"text":"B. Giai cấp nông dân","correct":false},{"text":"C. Giai cấp tiểu tư sản","correct":false},{"text":"D. Giai cấp tư sản","correct":false}],"lines":[]},{"id":29,"title":"Câu 29. Dấu hiệu đánh dấu sự trưởng thành vượt bậc của giai cấp công nhân với tư cách là giai cấp cách mạng là:","options":[{"text":"A. Sự trưởng thành về trình độ nhận thức","correct":false},{"text":"B. Sự ra đời của Đảng Cộng sản","correct":true},{"text":"C. Sự trưởng thành về trình độ kỹ thuật","correct":false},{"text":"D. Sự trưởng thành về ý thức chính trị","correct":false}],"lines":[]},{"id":30,"title":"Câu 30. Giai cấp công nhân Việt Nam có đặc điểm gì khác với giai cấp công nhân ở các nước tư bản? (Chọn 2 đáp án)","options":[{"text":"A. Xuất thân từ nông dân là chủ yếu","correct":true},{"text":"B. Không có sự gắn kết với các giai cấp, tầng lớp khác","correct":false},{"text":"C. Sở hữu tư liệu sản xuất trong xã hội","correct":false},{"text":"D. Chịu sự bóc lột của thực dân và phong kiến","correct":true}],"lines":[]},{"id":31,"title":"Câu 31. Câu nói sau đây được viết trong tác phẩm nào: \"Giai cấp tư sản, trong quá trình thống trị giai cấp chưa đầy một thế kỷ, đã tạo ra những lực lượng sản xuất nhiều hơn và đồ sộ hơn lực lượng sản xuất của tất cả các thế hệ trước gộp lại.\"","options":[{"text":"A. Bộ Tư bản","correct":false},{"text":"B. Chống Đuyrinh","correct":false},{"text":"C. Ba nguồn gốc và ba bộ phận cấu thành của chủ nghĩa Mác","correct":false},{"text":"D. Tuyên ngôn của Đảng Cộng sản","correct":true}],"lines":[]},{"id":32,"title":"Câu 32. Kéo thả các đáp án khớp với các phát biểu 1–3. Đáp án cho sẵn: giải phóng con người; giai cấp công nhân; giai cấp cách mạng; giai cấp vô sản.","options":[],"lines":["Thực hiện sự nghiệp giải phóng thế giới ấy, đó là sứ mệnh lịch sử của ______ hiện đại.","giai cấp vô sản","Sứ mệnh lịch sử của giai cấp công nhân là ______ khỏi áp bức, bất công, bóc lột.","giải phóng con người","Giai cấp công nhân là ______ và có tinh thần cách mạng triệt để.","giai cấp cách mạng"]},{"id":33,"title":"Câu 33. Chọn Đúng/Sai cho từng phát biểu:","options":[],"lines":["Giai cấp công nhân là giai cấp cách mạng và có tinh thần cách mạng triệt để. → Đúng","Giai cấp công nhân là chủ thể của quá trình sản xuất vật chất hiện đại. → Đúng","Đặc điểm nổi bật của giai cấp công nhân là lao động bằng phương thức nông nghiệp. → Sai","Giai cấp công nhân là những người lao động trực tiếp hay gián tiếp vận hành các công cụ sản xuất có tính chất công nghiệp ngày càng hiện đại và xã hội hóa cao. → Đúng"]},{"id":34,"title":"Câu 34. Chọn Đúng/Sai cho từng phát biểu:","options":[],"lines":["Giai cấp công nhân Việt Nam hiện nay đã tăng nhanh về số lượng và giảm về chất lượng. → Sai","Giai cấp công nhân Việt Nam là lực lượng nòng cốt của Đảng Cộng sản Việt Nam. → Đúng","Giai cấp công nhân phát huy vai trò và trách nhiệm của lực lượng đi đầu trong sự nghiệp đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước. → Đúng","Giai cấp công nhân Việt Nam gắn bó mật thiết với các tầng lớp nhân dân trong xã hội. → Đúng"]},{"id":35,"title":"Câu 35. Kéo thả các đáp án khớp với các phát biểu 1–3. Đáp án cho sẵn: giai cấp, tầng lớp; Đảng Cộng sản; tầng lớp trí thức; tầng lớp nhân dân.","options":[],"lines":["Giai cấp công nhân Việt Nam là lực lượng nòng cốt của ______ Việt Nam. → Đảng Cộng sản","Giai cấp công nhân Việt Nam gắn bó mật thiết với các ______ trong xã hội. → tầng lớp nhân dân","Giai cấp công nhân Việt Nam có mối quan hệ mật thiết với giai cấp nông dân và ______ trong xã hội. → tầng lớp trí thức"]},{"id":36,"title":"Câu 36. Nội dung sứ mệnh lịch sử của giai cấp công nhân Việt Nam hiện nay bao gồm: (Chọn 3 đáp án)","options":[{"text":"A. Nội dung kinh tế","correct":true},{"text":"B. Nội dung văn hóa, tư tưởng","correct":true},{"text":"C. Nội dung chính trị – xã hội","correct":true},{"text":"D. Nội dung lý luận","correct":false}],"lines":[]},{"id":37,"title":"Câu 37. Chủ nghĩa xã hội khoa học ra đời dựa trên cơ sở của những tiền đề nào? (Chọn 2 đáp án)","options":[{"text":"A. Tiền đề tư tưởng lý luận","correct":true},{"text":"B. Tiền đề khoa học lịch sử","correct":false},{"text":"C. Tiền đề khoa học tự nhiên","correct":true},{"text":"D. Tiền đề khoa học xã hội","correct":false}],"lines":[]},{"id":38,"title":"Câu 38. Chọn Đúng/Sai cho từng phát biểu:","options":[],"lines":["Giai cấp công nhân Việt Nam hiện nay đã tăng cả về số lượng và chất lượng. → Đúng","Giai cấp công nhân đại diện cho phương thức sản xuất tiên tiến và lực lượng sản xuất hiện đại. → Đúng","Đảng Cộng sản là nhân tố khách quan quan trọng nhất để giai cấp công nhân thực hiện thắng lợi sứ mệnh lịch sử của mình. → Sai (là nhân tố chủ quan)","Sự trưởng thành của Đảng Cộng sản là hạt nhân chính trị quan trọng của giai cấp công nhân. → Đúng"]},{"id":39,"title":"Câu 39. Kéo thả các yếu tố vào cột tương ứng:","options":[],"lines":["Điều kiện chủ quan để giai cấp công nhân thực hiện được sứ mệnh lịch sử:","Điều kiện khách quan quy định sứ mệnh lịch sử của giai cấp công nhân","-Đảng Cộng sản;","-Sự phát triển của bản thân giai cấp công nhân cả về số lượng và chất lượng","-Địa vị kinh tế của giai cấp công nhân;","-Địa vị chính trị – xã hội của giai cấp công nhân"]},{"id":40,"title":"Câu 40. Chọn Đúng/Sai cho từng phát biểu:","options":[],"lines":["Giai cấp công nhân Việt Nam hiện nay đã tăng nhanh về số lượng và chất lượng. → Đúng","Giai cấp công nhân Việt Nam là tầng lớp giàu có, ít chịu áp bức bóc lột. → Sai","Giai cấp công nhân Việt Nam hiện nay đa dạng về cơ cấu nghề nghiệp, có mặt trong mọi thành phần kinh tế. → Đúng","Giai cấp công nhân Việt Nam không có sự liên kết với các lực lượng cách mạng khác. → Sai"]},{"id":41,"title":"Câu 41 (bổ sung từ file free). Kéo thả: Chủ thể; Phương thức sản xuất; Lực lượng sản xuất; Nhân tố chủ quan.","options":[],"lines":["Đảng Cộng sản là ______ quan trọng nhất để giai cấp công nhân thực hiện thắng lợi sứ mệnh lịch sử của mình. → Nhân tố chủ quan","Giai cấp công nhân đại diện cho ______ tiên tiến. → Phương thức sản xuất","Giai cấp công nhân là ______ của quá trình sản xuất vật chất hiện đại. → Chủ thể","Giai cấp công nhân đại diện cho ______ hiện đại. → Lực lượng sản xuất"]}],"notes":[]},{"id":2,"name":"Bài 2 – Thời kỳ quá độ lên CNXH, dân chủ XHCN","questions":[{"id":1,"title":"Câu 1. Theo C.Mác và Ph.Ăngghen thì giai đoạn đầu của hình thái kinh tế - xã hội cộng sản chủ nghĩa là gì?","options":[{"text":"A. Chủ nghĩa xã hội","correct":true},{"text":"B. Thời kỳ quá độ","correct":false},{"text":"C. Cộng sản chủ nghĩa","correct":false},{"text":"D. Chủ nghĩa cộng sản","correct":false}],"lines":[]},{"id":2,"title":"Câu 2. Câu \"Cần phải có thời kỳ quá độ khá lâu dài từ chủ nghĩa tư bản lên chủ nghĩa xã hội\" là của ai?","options":[{"text":"A. Lênin","correct":true},{"text":"B. C.Mác","correct":false},{"text":"C. Heghen","correct":false},{"text":"D. Ăngghen","correct":false}],"lines":[]},{"id":3,"title":"Câu 3. Chủ nghĩa xã hội có mấy đặc trưng cơ bản?","options":[{"text":"A. 6","correct":true},{"text":"B. 5","correct":false},{"text":"C. 8","correct":false},{"text":"D. 7","correct":false}],"lines":[]},{"id":4,"title":"Câu 4. Đặc trưng về kinh tế của chủ nghĩa xã hội là gì?","options":[{"text":"A. Có nền kinh tế phát triển cao","correct":false},{"text":"B. Có nền kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại","correct":false},{"text":"C. Có nền kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại và chế độ tư hữu về tư liệu sản xuất","correct":false},{"text":"D. Có nền kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại và chế độ công hữu về tư liệu sản xuất","correct":true}],"lines":[]},{"id":5,"title":"Câu 5. Nguyên nhân sâu xa dẫn đến sự thay thế hình thái kinh tế - xã hội tư bản chủ nghĩa bằng hình thái kinh tế - xã hội cộng sản chủ nghĩa là gì?","options":[{"text":"A. Mâu thuẫn giữa lực lượng sản xuất mang tính xã hội hoá ngày càng cao với quan hệ sản xuất tư bản chủ nghĩa dựa trên chế độ chiếm hữu tư nhân tư bản chủ nghĩa về tư liệu sản xuất chủ yếu","correct":true},{"text":"B. Mâu thuẫn giữa phương thức sản xuất tư bản chủ nghĩa và phương thức sản xuất xã hội chủ nghĩa","correct":false},{"text":"C. Mâu thuẫn giữa các giai cấp, tầng lớp trong xã hội","correct":false},{"text":"D. Mâu thuẫn giữa lực lượng sản xuất và tư liệu sản xuất","correct":false}],"lines":[]},{"id":6,"title":"Câu 6. Theo quan điểm của chủ nghĩa Mác – Lê nin, mốc bắt đầu của thời kỳ quá độ lên chủ nghĩa xã hội từ khi nào?","options":[{"text":"A. Khi giai cấp công nhân đấu tranh giành chính quyền","correct":false},{"text":"B. Khi giai cấp công nhân và nhân dân lao động giành được chính quyền","correct":true},{"text":"C. Khi giai cấp công nhân tiến hành cải tạo xã hội cũ và xây dựng xã hội mới","correct":false},{"text":"D. Khi giai cấp công nhân và nhân dân lao động tiến hành cải tạo xã hội cũ","correct":false}],"lines":[]},{"id":7,"title":"Câu 7. Quá độ lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa ở nước ta, được hiểu là:","options":[{"text":"A. Bỏ qua việc xác lập vị trí thống trị của kiến trúc thượng tầng tư bản chủ nghĩa nhưng kế thừa những thành tựu mà nhân loại đã đạt được dưới chế độ tư bản chủ nghĩa","correct":false},{"text":"B. Bỏ qua việc xác lập vị trí thống trị của quan hệ sản xuất tư bản chủ nghĩa nhưng kế thừa những thành tựu mà nhân loại đã đạt được dưới chế độ tư bản chủ nghĩa","correct":false},{"text":"C. Bỏ qua việc xác lập vị trí thống trị của quan hệ sản xuất và kiến trúc thượng tầng tư bản chủ nghĩa nhưng không kế thừa những thành tựu mà nhân loại đã đạt được dưới chế độ tư bản chủ nghĩa","correct":false},{"text":"D. Bỏ qua việc xác lập vị trí thống trị của quan hệ sản xuất và kiến trúc thượng tầng tư bản chủ nghĩa, nhưng tiếp thu, kế thừa những thành tựu mà nhân loại đã đạt được dưới chế độ tư bản chủ nghĩa","correct":true}],"lines":[]},{"id":8,"title":"Câu 8. Kiểu quá độ lên chủ nghĩa xã hội ở Việt Nam là kiểu quá độ nào?","options":[{"text":"A. Quá độ trực tiếp","correct":false},{"text":"B. Quá độ chủ quan","correct":false},{"text":"C. Quá độ khách quan","correct":false},{"text":"D. Quá độ gián tiếp","correct":true}],"lines":[]},{"id":9,"title":"Câu 9. Phát triển bỏ qua chế độ tư bản chủ nghĩa ở Việt Nam được hiểu như thế nào?","options":[{"text":"A. Bỏ qua việc xác lập vị trí thống trị của quan hệ sản xuất và kiến trúc thượng tầng tư bản chủ nghĩa","correct":true},{"text":"B. Không xây dựng quan hệ sản xuất tư bản chủ nghĩa","correct":false},{"text":"C. Bỏ qua các yếu tố gắn với phương thức sản xuất tư bản chủ nghĩa","correct":false},{"text":"D. Bỏ qua sự phát triển của lực lượng sản xuất tư bản chủ nghĩa","correct":false}],"lines":[]},{"id":10,"title":"Câu 10. Điền từ vào chỗ trống ở mục tiêu của Đảng trong thời kỳ quá độ: \"Độc lập dân tộc gắn liền với chủ nghĩa xã hội; dân giàu, nước mạnh, dân chủ, ..., văn minh\".","options":[{"text":"A. Bình đẳng","correct":false},{"text":"B. Phát triển","correct":false},{"text":"C. Tiến bộ","correct":false},{"text":"D. Công bằng","correct":true}],"lines":[]},{"id":11,"title":"Câu 11. Tìm đáp án sai. Đặc trưng bản chất của chủ nghĩa xã hội Việt Nam theo tinh thần Đại hội XI:","options":[{"text":"A. Có quan hệ hữu nghị và hợp tác với các nước trên thế giới","correct":false},{"text":"B. Có nền văn hóa tiên tiến đậm đà bản sắc dân tộc","correct":false},{"text":"C. Quyền lực thuộc về giai cấp công nhân (sai: phải là do nhân dân làm chủ)","correct":true},{"text":"D. Con người có cuộc sống ấm no, tự do, hạnh phúc, có điều kiện phát triển toàn diện","correct":false}],"lines":[]},{"id":12,"title":"Câu 12. Trong cuốn sách \"Một số vấn đề lý luận và thực tiễn về chủ nghĩa xã hội và con đường đi lên chủ nghĩa xã hội ở Việt Nam\", Tổng Bí thư Nguyễn Phú Trọng khẳng định: đường lối cơ bản, xuyên suốt của cách mạng Việt Nam và cũng là điểm cốt yếu trong di sản tư tưởng của Chủ tịch Hồ Chí Minh là:","options":[{"text":"A. Phát triển kinh tế thị trường định hướng xã hội chủ nghĩa","correct":false},{"text":"B. Độc lập dân tộc gắn liền với chủ nghĩa xã hội","correct":true},{"text":"C. Chủ nghĩa xã hội và giải phóng giai cấp vô sản","correct":false},{"text":"D. Độc lập dân tộc gắn liền với hội nhập kinh tế quốc tế","correct":false}],"lines":[]},{"id":13,"title":"Câu 13. Chọn Đúng/Sai cho từng phát biểu:","options":[],"lines":["Trong thời kỳ quá độ từ CNTB lên CNXH tồn tại nền kinh tế nhiều thành phần. → Đúng","Trong thời kỳ quá độ từ CNTB lên CNXH tồn tại nhiều giai cấp, tầng lớp. → Đúng","Đặc điểm cơ bản của thời kỳ quá độ là thời kỳ cải tạo cách mạng sâu sắc, triệt để trên lĩnh vực kinh tế. → Sai","Trong thời kỳ quá độ từ CNTB lên CNXH tồn tại chủ yếu tư tưởng vô sản. → Sai"]},{"id":14,"title":"Câu 14. Ghép nối (đáp án cho sẵn: quá độ trực tiếp; quá độ gián tiếp; thời kỳ quá độ; con đường):","options":[],"lines":["______ từ CNTB lên CNCS đối với những nước đã trải qua CNTB phát triển. → Quá độ trực tiếp","______ từ CNTB lên CNCS đối với những nước chưa trải qua CNTB phát triển. → Quá độ gián tiếp","Thực chất của ______ lên CNXH là thời kỳ cải biến cách mạng từ xã hội tiền tư bản và tư bản chủ nghĩa sang xã hội xã hội chủ nghĩa. → Thời kỳ quá độ"]},{"id":15,"title":"Câu 15. Chọn Đúng/Sai cho từng phát biểu:","options":[],"lines":["Trong thời kỳ quá độ lên CNXH tồn tại nhiều thành phần kinh tế. → Đúng","Trong thời kỳ quá độ lên CNXH kinh tế tư nhân bị xóa bỏ hoàn toàn. → Sai","Thời kỳ quá độ lên CNXH chỉ có kinh tế nhà nước tồn tại và phát triển. → Sai","Thời kỳ quá độ lên CNXH có sự tồn tại song song giữa các yếu tố cũ và yếu tố mới. → Đúng"]},{"id":16,"title":"Câu 16. Đặc điểm nổi bật của thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam là gì? (Chọn 2 đáp án)","options":[{"text":"A. Từ một nền sản xuất nhỏ tiến lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa","correct":true},{"text":"B. Có sự lãnh đạo của Đảng Cộng sản Việt Nam","correct":true},{"text":"C. Xây dựng nhà nước pháp quyền tư sản","correct":false},{"text":"D. Phát triển chủ nghĩa tư bản trong thời gian ngắn để tích lũy","correct":false}],"lines":[]},{"id":17,"title":"Câu 17. Hình thái kinh tế - xã hội cộng sản chủ nghĩa bắt đầu và hoàn thiện khi nào? (Đã sửa: file free chọn \"bắt đầu từ giai đoạn thấp\")","options":[{"text":"A. Bắt đầu từ khi Đảng cộng sản ra đời và xây dựng xong chủ nghĩa xã hội","correct":false},{"text":"B. Bắt đầu từ thời kỳ quá độ và hoàn thiện ở giai đoạn thấp của xã hội cộng sản","correct":false},{"text":"C. Bắt đầu từ giai đoạn thấp của xã hội cộng sản và hoàn thiện ở giai đoạn cao của xã hội cộng sản","correct":false},{"text":"D. Bắt đầu từ thời kỳ quá độ cho đến khi xây dựng xong giai đoạn cao của xã hội cộng sản","correct":true}],"lines":[]},{"id":18,"title":"Câu 18. Chọn cụm từ còn thiếu: \"Giữa xã hội tư bản chủ nghĩa và xã hội cộng sản chủ nghĩa là một thời kỳ ... từ xã hội nọ sang xã hội kia\" (C.Mác)","options":[{"text":"A. Đột phá cách mạng","correct":false},{"text":"B. Cải biến cách mạng","correct":true},{"text":"C. Cách mạng","correct":false},{"text":"D. Quá độ","correct":false}],"lines":[]},{"id":19,"title":"Câu 19. Đặc điểm của thời kỳ quá độ lên chủ nghĩa xã hội trên lĩnh vực kinh tế là gì?","options":[{"text":"A. Tồn tại nhiều thành phần kinh tế","correct":true},{"text":"B. Tồn tại giai cấp đối kháng","correct":false},{"text":"C. Tồn tại nhiều tàn dư văn hóa của chế độ cũ","correct":false},{"text":"D. Tồn tại đấu tranh giai cấp","correct":false}],"lines":[]},{"id":20,"title":"Câu 20. Hãy chỉ ra luận điểm không chính xác: (Đã sửa: file free chọn nhầm vào luận điểm đúng)","options":[{"text":"A. Nhà nước trong thời kỳ quá độ lên CNXH là nền chuyên chính cách mạng của giai cấp công nhân","correct":false},{"text":"B. Trong thời kỳ quá độ lên CNXH có thể và cần phải thủ tiêu mọi tàn tích của chủ nghĩa tư bản","correct":true},{"text":"C. Giữa xã hội tư bản chủ nghĩa và xã hội xã hội chủ nghĩa là thời kỳ cải biến cách mạng lâu dài và phức tạp","correct":false},{"text":"D. Trong thời kỳ quá độ lên CNXH còn tồn tại nhiều tư tưởng – văn hóa cũ và mới đan xen, đấu tranh với nhau","correct":false}],"lines":[]},{"id":21,"title":"Câu 21. Chọn  phương án sai:","options":[{"text":"A. Quá độ lên CNXH bỏ qua chế độ TBCN nhưng có sự tiếp thu, kế thừa toàn bộ các lĩnh vực đã tạo ra dưới chế độ TBCN","correct":true},{"text":"B. Quá độ lên CNXH bỏ qua chế độ TBCN tức là bỏ qua việc xác lập vị trí thống trị của quan hệ sản xuất và kiến trúc thượng tầng TBCN","correct":false},{"text":"C. Quá độ lên CNXH bỏ qua chế độ TBCN là con đường cách mạng tất yếu chủ quan, con đường xây dựng đất nước trong thời kỳ quá độ lên CNXH","correct":false},{"text":"D. Con đường đi lên CNXH của nước ta là sự phát triển quá độ lên CNXH bỏ qua chế độ TBCN","correct":false}],"lines":["Giải thích: A sai vì không tiếp thu toàn bộ các lĩnh vực; C sai vì phải là “tất yếu khách quan”, không phải “tất yếu chủ quan”. Câu gốc yêu cầu chọn một phương án nhưng có hai phương án sai."]},{"id":22,"title":"Câu 22. Thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam là bước quá độ:","options":[{"text":"A. Gián tiếp, bỏ qua chế độ phong kiến tiến lên chế độ xã hội chủ nghĩa","correct":false},{"text":"B. Gián tiếp, bỏ qua chế độ tư bản chủ nghĩa tiến lên chủ nghĩa xã hội","correct":true},{"text":"C. Trực tiếp, từ chế độ phong kiến tiến lên chế độ xã hội chủ nghĩa","correct":false},{"text":"D. Trực tiếp, từ chế độ tư bản chủ nghĩa lên chế độ xã hội chủ nghĩa","correct":false}],"lines":[]},{"id":23,"title":"Câu 23. Về nội dung, thời kỳ quá độ lên CNXH là thời kỳ cải tạo cách mạng sâu sắc, triệt để xã hội tư bản chủ nghĩa trên các lĩnh vực:","options":[{"text":"A. Chủ yếu về văn hóa","correct":false},{"text":"B. Chủ yếu về chính trị","correct":false},{"text":"C. Kinh tế, chính trị, văn hóa, xã hội","correct":true},{"text":"D. Chủ yếu là chính trị","correct":false}],"lines":[]},{"id":24,"title":"Câu 24. Đặc điểm nổi bật của thời kỳ quá độ đó là:","options":[{"text":"A. Những nhân tố của xã hội mới và những tàn tích của xã hội cũ tồn tại đan xen lẫn nhau, đấu tranh với nhau trên mọi lĩnh vực","correct":true},{"text":"B. Tàn dư của xã hội cũ còn tồn tại","correct":false},{"text":"C. Những yếu tố của xã hội mới đã phát triển, xoá bỏ hoàn toàn yếu tố của xã hội cũ","correct":false},{"text":"D. Toàn bộ các yếu tố của xã hội bị triệt tiêu","correct":false}],"lines":[]},{"id":25,"title":"Câu 25. Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên CNXH (bổ sung và phát triển năm 2011) được Đảng ta thông qua ở đại hội lần thứ mấy?","options":[{"text":"A. Đại hội X","correct":false},{"text":"B. Đại hội XI","correct":true},{"text":"C. Đại hội XII","correct":false},{"text":"D. Đại hội IX","correct":false}],"lines":[]},{"id":26,"title":"Câu 26. Đặc điểm về chính trị trong thời kỳ quá độ được thể hiện ở điểm nào? (Chọn 2 đáp án)","options":[{"text":"A. Xây dựng nền dân chủ xã hội chủ nghĩa","correct":true},{"text":"B. Đa nguyên chính trị, đa đảng đối lập","correct":false},{"text":"C. Hoàn toàn không còn vai trò của nhà nước","correct":false},{"text":"D. Thiết lập chuyên chính vô sản","correct":true}],"lines":[]},{"id":27,"title":"Câu 27. Chọn Đúng/Sai cho từng phát biểu:","options":[],"lines":["Việc \"bỏ qua\" chế độ TBCN là không kế thừa bất kỳ yếu tố tích cực nào của CNTB. → Sai","Nhà nước pháp quyền XHCN Việt Nam là nhà nước của nhân dân, do nhân dân, vì nhân dân. → Đúng","CNXH ở Việt Nam không chấp nhận kinh tế tư nhân tồn tại song song với kinh tế nhà nước. → Sai","Việt Nam quá độ lên CNXH từ một nền sản xuất nhỏ, bỏ qua chế độ TBCN. → Đúng"]},{"id":28,"title":"Câu 28. Chọn Đúng/Sai cho từng phát biểu:","options":[],"lines":["Lịch sử xã hội đã trải qua 4 hình thái kinh tế - xã hội. → Sai","Quá độ gián tiếp từ CNTB lên CNCS đối với những nước chưa trải qua CNTB phát triển. → Đúng","Thực chất của thời kỳ quá độ lên CNXH là thời kỳ cải biến cách mạng từ xã hội tiền tư bản và tư bản chủ nghĩa sang xã hội XHCN. → Đúng","Quá độ trực tiếp từ CNTB lên CNCS đối với những nước đã trải qua CNTB phát triển. → Đúng"]},{"id":29,"title":"Câu 29. Tại sao cho rằng con đường cách mạng Việt Nam là quá độ lên CNXH bỏ qua chế độ TBCN là một tất yếu?","options":[{"text":"A. Vì sự phát triển của lực lượng sản xuất ngày càng cao","correct":false},{"text":"B. Vì không cần tạo ra sự biến đổi về chất trên tất cả các lĩnh vực","correct":false},{"text":"C. Vì không cần tiếp thu thành tựu khoa học, kỹ thuật dưới chế độ TBCN","correct":false},{"text":"D. Vì nó phù hợp với đặc điểm của đất nước và xu thế phát triển của thời đại","correct":true}],"lines":[]},{"id":30,"title":"Câu 30. Khái niệm dùng để chỉ một chế độ xã hội tốt đẹp, giai đoạn đầu của hình thái kinh tế - xã hội cộng sản chủ nghĩa:","options":[{"text":"A. Thời kỳ quá độ","correct":false},{"text":"B. Chủ nghĩa xã hội","correct":true},{"text":"C. Thời kỳ quá độ lên chủ nghĩa xã hội","correct":false},{"text":"D. Chủ nghĩa cộng sản","correct":false}],"lines":[]},{"id":31,"title":"Câu 31. Hai loại quá độ từ chủ nghĩa tư bản lên chủ nghĩa cộng sản là: (Chọn 2 đáp án)","options":[{"text":"A. Quá độ gián tiếp","correct":true},{"text":"B. Quá độ không cơ bản","correct":false},{"text":"C. Quá độ trực tiếp","correct":true},{"text":"D. Quá độ cơ bản","correct":false}],"lines":[]},{"id":32,"title":"Câu 32. Đặc điểm về kinh tế của thời kỳ quá độ lên CNXH gồm: (Chọn 2 đáp án)","options":[{"text":"A. Tồn tại nền kinh tế nhiều thành phần","correct":true},{"text":"B. Chỉ có kinh tế nhà nước tồn tại và phát triển","correct":false},{"text":"C. Hoàn toàn không còn kinh tế tư nhân","correct":false},{"text":"D. Có những thành phần kinh tế đối lập nhau","correct":true}],"lines":[]},{"id":33,"title":"Câu 33. Việc \"bỏ qua chế độ tư bản chủ nghĩa\" ở Việt Nam có nghĩa là: (Chọn 2 đáp án)","options":[{"text":"A. Bỏ qua việc xác lập vị trí thống trị của quan hệ sản xuất và kiến trúc thượng tầng tư bản chủ nghĩa","correct":true},{"text":"B. Tăng cường sở hữu tư nhân để phát triển lực lượng sản xuất","correct":false},{"text":"C. Tiếp thu, kế thừa những thành tựu nhân loại đã đạt được dưới chủ nghĩa tư bản","correct":true},{"text":"D. Loại bỏ hoàn toàn tất cả yếu tố tư bản trong nền kinh tế","correct":false}],"lines":[]},{"id":34,"title":"Câu 34. Kéo thả (đáp án cho sẵn: Quá độ gián tiếp; Quá độ trực tiếp; Tất yếu khách quan; Vị trí thống trị):","options":[],"lines":["Quá độ lên CNXH bỏ qua chế độ TBCN là con đường cách mạng ______. → Tất yếu khách quan","Bỏ qua việc xác lập ______ của quan hệ sản xuất và kiến trúc thượng tầng TBCN. → Vị trí thống trị","Việt Nam thực hiện ______ đi lên CNXH. → Quá độ gián tiếp"]},{"id":35,"title":"Câu 35. Cuộc cách mạng của giai cấp công nhân và nhân dân lao động dưới sự lãnh đạo của Đảng Cộng sản chống lại giai cấp tư sản là cuộc cách mạng:","options":[{"text":"A. Cách mạng tư sản","correct":false},{"text":"B. Cách mạng dân chủ tư sản","correct":false},{"text":"C. Cách mạng xã hội","correct":false},{"text":"D. Cách mạng vô sản","correct":true}],"lines":[]},{"id":36,"title":"Câu 36. Thời kỳ quá độ lên CNXH có những mâu thuẫn nào cần giải quyết? (Chọn 2 đáp án)","options":[{"text":"A. Mâu thuẫn giữa các tầng lớp lao động và tư sản hoàn toàn biến mất","correct":false},{"text":"B. Mâu thuẫn giữa các thành phần kinh tế khác nhau trong xã hội","correct":true},{"text":"C. Mâu thuẫn giữa năng suất lao động và nhu cầu phát triển xã hội","correct":false},{"text":"D. Mâu thuẫn giữa cái cũ và cái mới trong xã hội","correct":true}],"lines":[]},{"id":37,"title":"Câu 37. Đặc điểm cơ bản của thời kỳ quá độ lên CNXH ở Việt Nam là gì? (Chọn 2 đáp án)","options":[{"text":"A. Xây dựng nền kinh tế thị trường định hướng xã hội chủ nghĩa","correct":true},{"text":"B. Bỏ qua chế độ phong kiến","correct":false},{"text":"C. Chuyển thẳng từ chế độ phong kiến lên chủ nghĩa xã hội","correct":false},{"text":"D. Bỏ qua chế độ tư bản chủ nghĩa","correct":true}],"lines":[]},{"id":38,"title":"Câu 38. Kéo thả (đáp án cho sẵn: Quyền con người; Nhà nước pháp quyền; Chế độ chính trị; Kinh tế thị trường):","options":[],"lines":["Việt Nam xây dựng nền ______ có sự điều tiết của nhà nước. → Kinh tế thị trường","Một đặc trưng chính trị của CNXH là xây dựng ______ XHCN của nhân dân, do nhân dân, vì nhân dân. → Nhà nước pháp quyền","Nhà nước pháp quyền XHCN Việt Nam tôn trọng, bảo vệ và bảo đảm ______. → Quyền con người"]},{"id":39,"title":"Câu 39. Chọn Đúng/Sai cho từng phát biểu:","options":[],"lines":["Việt Nam thực hiện quá độ trực tiếp đi lên chủ nghĩa xã hội. → Sai","Phát triển nền kinh tế thị trường định hướng XHCN là một trong những phương hướng xây dựng CNXH ở Việt Nam. → Đúng","Quá độ lên CNXH bỏ qua chế độ TBCN là sự lựa chọn duy nhất đúng, khoa học, phản ánh đúng quy luật phát triển khách quan của cách mạng Việt Nam. → Đúng","CNXH ở Việt Nam không bao gồm việc xây dựng nền kinh tế thị trường. → Sai"]},{"id":40,"title":"Câu 40 (bổ sung từ file free). So với các nền dân chủ trước đây, dân chủ xã hội chủ nghĩa có đặc điểm khác biệt cơ bản nào?","options":[{"text":"A. Là nền dân chủ phi lịch sử","correct":false},{"text":"B. Là nền dân chủ thuần túy","correct":false},{"text":"C. Là nền dân chủ rộng rãi cho giai cấp công nhân và nhân dân lao động","correct":true},{"text":"D. Không mang tính giai cấp","correct":false}],"lines":[]},{"id":41,"title":"Câu 41 (bổ sung từ file free). Chọn Đúng/Sai:","options":[],"lines":["Dân chủ là một phạm trù mang tính lịch sử, gắn với sự xuất hiện và phát triển của nhà nước. → Đúng","Dân chủ XHCN là nền dân chủ cao hơn về chất so với nền dân chủ tư sản. → Đúng","Dân chủ XHCN là sự phủ định sạch trơn những thành tựu dân chủ trước đó. → Sai","Trong xã hội tư bản, dân chủ thực chất thuộc về giai cấp tư sản. → Đúng"]},{"id":42,"title":"Câu 42 (bổ sung từ file free). Kéo thả:","options":[],"lines":["Dân chủ XHCN là sự kết hợp giữa hình thức dân chủ đại diện và ______. → Dân chủ trực tiếp","Dân chủ XHCN đảm bảo phát huy đầy đủ ______ của nhân dân trên tất cả các lĩnh vực. → Quyền làm chủ","Nền dân chủ XHCN là nền dân chủ mang bản chất của ______. → Giai cấp công nhân"]},{"id":43,"title":"Câu 43 (bổ sung từ file free). Chọn Đúng/Sai:","options":[],"lines":["Đảng ta khẳng định một trong những đặc trưng của CNXH Việt Nam là do nhân dân làm chủ. → Đúng","Trong hoạt động của nhà nước pháp quyền XHCN ở Việt Nam, các cơ quan nhà nước không được phân quyền rõ ràng. → Sai","Bản chất dân chủ XHCN ở Việt Nam được thực hiện thông qua dân chủ gián tiếp và dân chủ trực tiếp. → Đúng","Quốc hội là cơ quan quyền lực nhà nước cao nhất, hoạt động theo nhiệm kỳ 3 năm. → Sai (nhiệm kỳ 5 năm)"]},{"id":44,"title":"Câu 44 (bổ sung từ file free). Dân chủ trong xã hội nguyên thủy được thể hiện như thế nào? (Chọn 2 đáp án)","options":[{"text":"A. Mọi người đều bình đẳng trong các quyết định các vấn đề chung","correct":true},{"text":"B. Không có sự phân chia giai cấp và quyền lực","correct":true},{"text":"C. Hình thành tổ chức chính trị phức tạp","correct":false},{"text":"D. Quyền lực tập trung vào một số cá nhân","correct":false}],"lines":[]},{"id":45,"title":"Câu 45 (bổ sung từ file free). Chọn Đúng/Sai:","options":[],"lines":["Dân chủ XHCN là công cụ để giai cấp công nhân thực hiện chuyên chính với các giai cấp khác. → Sai","Cho đến nay trong lịch sử nhân loại có năm nền (chế độ) dân chủ. → Sai","Dân chủ tư sản là hình thức dân chủ gắn với quyền lực chính trị của giai cấp tư sản. → Đúng","Nền dân chủ chủ nô gắn với chế độ chiếm hữu nô lệ. → Đúng"]}],"notes":[]},{"id":3,"name":"Bài 3 – Dân chủ XHCN và Nhà nước pháp quyền XHCN","questions":[{"id":1,"title":"Câu 1. Bản chất kinh tế của nền dân chủ xã hội chủ nghĩa là:","options":[{"text":"A. Thực hiện chế độ phân phối “Làm theo năng lực, hưởng theo nhu cầu”","correct":false},{"text":"B. Thực hiện chế độ tư hữu về công cụ sản xuất chủ yếu","correct":false},{"text":"C. Thực hiện chế độ công hữu về tư liệu sản xuất chủ yếu và thực hiện chế độ phân phối lợi ích theo kết quả lao động là chủ yếu","correct":true},{"text":"D. Thực hiện chế độ tư hữu về tư liệu sản xuất","correct":false}],"lines":[]},{"id":2,"title":"Câu 2. Sự ra đời của nhà nước xã hội chủ nghĩa gắn với sự kiện nào?","options":[{"text":"A. Giai cấp công nhân xây dựng xong CNXH","correct":false},{"text":"B. Giai cấp công nhân lật đổ nhà nước của giai cấp bóc lột, giành được chính quyền","correct":true},{"text":"C. Giai cấp công nhân đấu tranh phản đối tình trạng áp bức bóc lột của giai cấp tư sản","correct":false},{"text":"D. Giai cấp công nhân đấu tranh đòi tăng lương, giảm giờ làm, cải thiện điều kiện lao động","correct":false}],"lines":[]},{"id":3,"title":"Câu 3. Nhà nước pháp quyền XHCN quản lý mọi mặt của đời sống xã hội chủ yếu bằng gì?","options":[{"text":"A. Giáo dục","correct":false},{"text":"B. Hiến pháp, pháp luật","correct":true},{"text":"C. Đường lối, chính sách","correct":false},{"text":"D. Tuyên truyền","correct":false}],"lines":[]},{"id":4,"title":"Câu 4. Tại sao quyền lực nhà nước ở Việt Nam được tổ chức theo nguyên tắc thống nhất?","options":[{"text":"A. Để đảm bảo sự phối hợp và kiểm soát giữa các cơ quan lập pháp, hành pháp và tư pháp","correct":true},{"text":"B. Để kiểm soát chặt chẽ các hoạt động kinh tế","correct":false},{"text":"C. Để giảm thiểu vai trò của các tổ chức phi chính phủ","correct":false},{"text":"D. Để tăng cường sự kiểm soát của nhà nước","correct":false}],"lines":[]},{"id":5,"title":"Câu 5. Đặc điểm nổi bật của nền dân chủ xã hội chủ nghĩa là gì? (Chọn 2 đáp án)","options":[{"text":"A. Đặt quyền lợi của nhân dân lao động lên hàng đầu","correct":true},{"text":"B. Thực hiện quyền làm chủ tập thể của nhân dân","correct":true},{"text":"C. Tôn trọng quyền sở hữu tư nhân tuyệt đối","correct":false},{"text":"D. Phân biệt rõ ràng giữa các tầng lớp xã hội","correct":false}],"lines":[]},{"id":6,"title":"Câu 6. Theo nguyên nghĩa tiếng Hy Lạp thì “Dân chủ” là gì?","options":[{"text":"A. Là quyền lực thuộc về nhân dân","correct":true},{"text":"B. Là quyền tự do của mỗi người","correct":false},{"text":"C. Là quyền của con người","correct":false},{"text":"D. Là trật tự xã hội","correct":false}],"lines":[]},{"id":7,"title":"Câu 7. Bản chất chính trị của nền dân chủ xã hội chủ nghĩa thể hiện như thế nào?","options":[{"text":"A. Nhà nước chủ yếu thực hiện các quyết định chính trị mà không cần sự đồng thuận hoặc tham gia của người dân","correct":false},{"text":"B. Nền dân chủ tập trung vào phát triển kinh tế tư nhân và bảo vệ lợi ích của tầng lớp giàu có","correct":false},{"text":"C. Quyền lực và lợi ích thuộc về toàn thể nhân dân lao động, trong đó có giai cấp công nhân, dưới sự lãnh đạo của Đảng Cộng sản","correct":true},{"text":"D. Quyền lực thuộc về một cá nhân duy nhất, không có sự tham gia của quần chúng nhân dân","correct":false}],"lines":[]},{"id":8,"title":"Câu 8. Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam được xây dựng dựa trên những nguyên tắc nào sau đây? (Chọn 2 đáp án)","options":[{"text":"A. Đảng lãnh đạo nhà nước theo phương thức mệnh lệnh","correct":false},{"text":"B. Nhà nước quản lý xã hội bằng hiến pháp, pháp luật","correct":true},{"text":"C. Quyền lực nhà nước là tối cao, không cần kiểm soát","correct":false},{"text":"D. Quyền lực nhà nước thống nhất, có phân công, phối hợp và kiểm soát","correct":true}],"lines":[]},{"id":9,"title":"Câu 9. Bằng hiểu biết của bản thân, hãy cho biết đâu là hình thức dân chủ gián tiếp?","options":[{"text":"A. Người dân bầu ra đại diện của mình để thay mặt họ quyết định các vấn đề quan trọng trong quốc hội hoặc cơ quan lập pháp","correct":true},{"text":"B. Người dân tham gia trực tiếp vào các cuộc trưng cầu dân ý về các chính sách hoặc luật pháp cụ thể","correct":false},{"text":"C. Người dân tự tổ chức các phong trào xã hội để yêu cầu các quyền lợi mà không thông qua bất kỳ đại diện nào","correct":false},{"text":"D. Người dân trực tiếp tham gia bỏ phiếu để quyết định các vấn đề quan trọng của đất nước","correct":false}],"lines":[]},{"id":10,"title":"Câu 10. Dân chủ xã hội chủ nghĩa mang tính nhất nguyên về chính trị, được hiểu là:","options":[{"text":"A. Nền dân chủ xã hội chủ nghĩa đại biểu cho trí tuệ, lợi ích của riêng giai cấp công nhân và giai cấp nông dân","correct":false},{"text":"B. Nền dân chủ xã hội chủ nghĩa do Đảng Cộng sản lãnh đạo – đại biểu cho trí tuệ, lợi ích của giai cấp công nhân, nhân dân lao động và toàn dân tộc","correct":true},{"text":"C. Nền dân chủ xã hội chủ nghĩa đại biểu cho trí tuệ, lợi ích của riêng giai cấp công nhân và tầng lớp trí thức","correct":false},{"text":"D. Nền dân chủ xã hội chủ nghĩa đại biểu cho trí tuệ, lợi ích của riêng giai cấp công nhân và nhân dân lao động","correct":false}],"lines":[]},{"id":11,"title":"Câu 11. Căn cứ vào phạm vi tác động của quyền lực nhà nước, chức năng của nhà nước được chia thành:","options":[{"text":"A. Chức năng chính trị, kinh tế, văn hóa, xã hội","correct":false},{"text":"B. Chức năng đối nội và chức năng đối ngoại","correct":true},{"text":"C. Chức năng trấn áp và chức năng tổ chức, xây dựng","correct":false},{"text":"D. Chức năng giai cấp, xã hội","correct":false}],"lines":[]},{"id":12,"title":"Câu 12. So với các mô hình nhà nước khác trong lịch sử thì nhà nước pháp quyền xã hội chủ nghĩa ở Việt Nam có sự khác biệt về chất như thế nào?","options":[{"text":"A. Vừa mang bản chất của giai cấp công nhân và nhân dân lao động","correct":false},{"text":"B. Mang bản chất của đa số nhân dân lao động","correct":false},{"text":"C. Mang bản chất của giai cấp công nhân","correct":false},{"text":"D. Mang bản chất của giai cấp công nhân, tính nhân dân rộng rãi và tính dân tộc sâu sắc","correct":true}],"lines":[]},{"id":13,"title":"Câu 13. Hãy xác định biện pháp để nâng cao hiệu quả hoạt động của Nhà nước pháp quyền xã hội chủ nghĩa ở Việt Nam.","options":[{"text":"A. Giảm thiểu sự can thiệp của các tổ chức xã hội","correct":false},{"text":"B. Xây dựng và từng bước hoàn thiện hệ thống giám sát, phản biện xã hội","correct":true},{"text":"C. Tăng cường sự kiểm soát của nhà nước","correct":false},{"text":"D. Giảm thiểu sự phát triển của khu vực tư nhân","correct":false}],"lines":[]},{"id":14,"title":"Câu 14. Lịch sử loài người đã từng xuất hiện các nền dân chủ nào?","options":[{"text":"A. Nền dân chủ chủ nô, nền dân chủ tư sản, nền dân chủ xã hội chủ nghĩa","correct":true},{"text":"B. Nền dân chủ nguyên thủy, nền dân chủ chủ nô, nền dân chủ phong kiến, nền dân chủ tư sản, nền dân chủ vô sản","correct":false},{"text":"C. Nền dân chủ chủ nô, nền dân chủ phong kiến, nền dân chủ tư sản","correct":false},{"text":"D. Nền dân chủ chủ nô, nền dân chủ phong kiến, nền dân chủ tư sản, nền dân chủ vô sản","correct":false}],"lines":[]},{"id":15,"title":"Câu 15. Kiểu nhà nước nào sau đây được V.I. Lênin gọi là nhà nước “nửa nhà nước”?","options":[{"text":"A. Nhà nước chủ nô","correct":false},{"text":"B. Nhà nước phong kiến","correct":false},{"text":"C. Nhà nước tư sản","correct":false},{"text":"D. Nhà nước xã hội chủ nghĩa","correct":true}],"lines":[]},{"id":16,"title":"Câu 16. Bản chất của nền dân chủ xã hội chủ nghĩa là: (Chọn 2 đáp án)","options":[{"text":"A. Nền dân chủ của đa số nhân dân lao động","correct":true},{"text":"B. Nền dân chủ mang tính tập thể","correct":true},{"text":"C. Nền dân chủ mang tính cá nhân","correct":false},{"text":"D. Nền dân chủ của giai cấp tư sản","correct":false}],"lines":[]},{"id":17,"title":"Câu 17. Đặc điểm của nhà nước pháp quyền xã hội chủ nghĩa là gì?","options":[{"text":"A. Quản lý xã hội bằng pháp luật","correct":true},{"text":"B. Quản lý xã hội bằng niềm tin","correct":false},{"text":"C. Quản lý xã hội bằng dư luận","correct":false},{"text":"D. Quản lý xã hội bằng mệnh lệnh hành chính","correct":false}],"lines":[]},{"id":18,"title":"Câu 18. Nền dân chủ xã hội chủ nghĩa ở Việt Nam có điểm khác biệt cơ bản nào so với các nền dân chủ trước đây?","options":[{"text":"A. Là nền dân chủ rộng rãi cho giai cấp công nhân và nhân dân lao động","correct":true},{"text":"B. Còn mang tính giai cấp","correct":false},{"text":"C. Là nền dân chủ thuần túy","correct":false},{"text":"D. Là nền dân chủ phi lịch sử","correct":false}],"lines":[]},{"id":19,"title":"Câu 19. Chọn ý không đúng về điểm khác biệt của nền dân chủ xã hội chủ nghĩa so với nền dân chủ tư sản:","options":[{"text":"A. Trước hết và chủ yếu được thực hiện bằng Nhà nước pháp quyền xã hội chủ nghĩa","correct":false},{"text":"B. Mang tính nhất nguyên về chính trị","correct":false},{"text":"C. Dựa trên chế độ sở hữu xã hội về những tư liệu sản xuất chủ yếu của toàn xã hội","correct":false},{"text":"D. Không mang tính giai cấp","correct":true}],"lines":[]},{"id":20,"title":"Câu 20. Dân chủ trong xã hội nguyên thủy được thể hiện như thế nào? (Chọn 2 đáp án)","options":[{"text":"A. Không có sự phân chia giai cấp và quyền lực","correct":true},{"text":"B. Hình thành tổ chức chính trị phức tạp","correct":false},{"text":"C. Mọi người đều bình đẳng trong quyết định các vấn đề chung","correct":true},{"text":"D. Quyền lực tập trung vào một số cá nhân","correct":false}],"lines":[]},{"id":21,"title":"Câu 21. Bản chất dân chủ xã hội chủ nghĩa ở Việt Nam được thực hiện thông qua:","options":[{"text":"A. Các hình thức dân chủ tự nguyện","correct":false},{"text":"B. Các hình thức dân chủ không tự nguyện","correct":false},{"text":"C. Các hình thức dân chủ cơ bản và không cơ bản","correct":false},{"text":"D. Các hình thức dân chủ gián tiếp và trực tiếp","correct":true}],"lines":[]},{"id":22,"title":"Câu 22. Nhà nước pháp quyền xã hội chủ nghĩa ở Việt Nam có đặc điểm như thế nào?","options":[{"text":"A. Nhà nước được tổ chức và hoạt động trên cơ sở Hiến pháp và pháp luật","correct":true},{"text":"B. Nhà nước hình thành là kết quả của cách mạng xã hội chủ nghĩa","correct":false},{"text":"C. Nhà nước đặt dưới sự lãnh đạo của Đảng Cộng sản","correct":false},{"text":"D. Nhà nước hoạt động trên nền tảng của khối liên minh công – nông – trí thức","correct":false}],"lines":[]},{"id":23,"title":"Câu 23. Bản chất tư tưởng – văn hóa – xã hội của nền dân chủ xã hội chủ nghĩa được thể hiện ở nội dung nào?","options":[{"text":"A. Lấy hệ tư tưởng của giai cấp nông dân làm chủ đạo","correct":false},{"text":"B. Lấy hệ tư tưởng Mác – Lênin – hệ tư tưởng của giai cấp công nhân làm chủ đạo","correct":true},{"text":"C. Lấy hệ tư tưởng của giai cấp tiểu tư sản làm chủ đạo","correct":false},{"text":"D. Lấy hệ tư tưởng của giai cấp tư sản làm chủ đạo","correct":false}],"lines":[]},{"id":24,"title":"Câu 24. Hãy xác định mục tiêu chính của việc xây dựng Nhà nước pháp quyền xã hội chủ nghĩa ở Việt Nam.","options":[{"text":"A. Tăng cường sự kiểm soát của nhà nước","correct":false},{"text":"B. Phát triển kinh tế thị trường tự do","correct":false},{"text":"C. Giảm thiểu sự can thiệp của nhà nước","correct":false},{"text":"D. Phục vụ lợi ích của giai cấp công nhân và nhân dân lao động","correct":true}],"lines":[]},{"id":25,"title":"Câu 25. Đâu là định nghĩa đúng và đầy đủ về dân chủ?","options":[{"text":"A. Dân chủ là một giá trị phản ánh những quyền cơ bản của con người; là một hình thức tổ chức nhà nước của giai cấp cầm quyền; có quá trình ra đời, phát triển cùng với lịch sử xã hội nhân loại","correct":true},{"text":"B. Dân chủ là một giá trị xã hội phản ánh sự nghiệp đấu tranh của con người vì sự phát triển tiến bộ xã hội","correct":false},{"text":"C. Dân chủ là một giá trị phản ánh những quyền tối thiểu của con người; là một hình thái tổ chức nhà nước thừa nhận quyền làm chủ của nhân dân; là một giá trị xã hội phản ánh sự nghiệp đấu tranh của con người","correct":false},{"text":"D. Dân chủ là giá trị phản ánh quyền cơ bản của con người; là kết quả của sự nghiệp đấu tranh của con người vì lợi ích của con người","correct":false}],"lines":[]},{"id":26,"title":"Câu 26. So với các nền dân chủ trước đây, dân chủ xã hội chủ nghĩa có điểm khác biệt cơ bản nào?","options":[{"text":"A. Là nền dân chủ thuần túy","correct":false},{"text":"B. Không còn mang tính giai cấp","correct":false},{"text":"C. Là nền dân chủ phi lịch sử","correct":false},{"text":"D. Là nền dân chủ rộng rãi cho giai cấp công nhân và nhân dân lao động","correct":true}],"lines":[]},{"id":27,"title":"Câu 27. Dân chủ xã hội chủ nghĩa ở Việt Nam là: (Chọn 2 đáp án)","options":[{"text":"A. Chế độ dân chủ không phụ thuộc vào nhà nước","correct":false},{"text":"B. Nền dân chủ gắn liền với sự lãnh đạo của Đảng Cộng sản Việt Nam","correct":true},{"text":"C. Chế độ dân chủ tư sản mở rộng","correct":false},{"text":"D. Nền dân chủ bảo đảm quyền lực thuộc về nhân dân","correct":true}],"lines":[]},{"id":28,"title":"Câu 28. Chế độ dân chủ nhân dân ở Việt Nam được xác lập từ khi nào?","options":[{"text":"A. Sau kháng chiến chống đế quốc Mỹ năm 1975","correct":false},{"text":"B. Sau khi Đảng Cộng sản ra đời","correct":false},{"text":"C. Sau kháng chiến chống thực dân Pháp năm 1954","correct":false},{"text":"D. Sau Cách mạng Tháng Tám năm 1945","correct":true}],"lines":[]},{"id":29,"title":"Câu 29. Dân chủ xã hội chủ nghĩa ở Việt Nam là: (Chọn 2 đáp án)","options":[{"text":"A. Nền dân chủ bảo đảm quyền lực thuộc về nhân dân","correct":true},{"text":"B. Nền dân chủ gắn liền với sự lãnh đạo của Đảng Cộng sản Việt Nam","correct":true},{"text":"C. Chế độ dân chủ không phụ thuộc vào nhà nước","correct":false},{"text":"D. Chế độ dân chủ tư sản mở rộng","correct":false}],"lines":[]},{"id":30,"title":"Câu 30. Chọn Đúng/Sai cho từng phát biểu:","options":[],"lines":["Dân chủ xã hội chủ nghĩa là nền dân chủ cao hơn về chất so với nền dân chủ tư sản. → Đúng","Dân chủ là một phạm trù mang tính lịch sử, gắn với sự xuất hiện và phát triển của nhà nước. → Đúng","Dân chủ xã hội chủ nghĩa là sự phủ định sạch trơn những thành tựu dân chủ trước đó. → Sai","Trong xã hội tư bản, dân chủ thực chất thuộc về giai cấp tư sản. → Đúng"]},{"id":31,"title":"Câu 31. Kéo thả (đáp án cho sẵn: Bản chất giai cấp; Dân chủ tư sản; Dân chủ xã hội chủ nghĩa; Chiếm hữu nô lệ):","options":[],"lines":["Mỗi kiểu dân chủ trong lịch sử đều mang ______ nhất định. → Bản chất giai cấp","______ là hình thức dân chủ ra đời từ cách mạng tư sản. → Dân chủ tư sản","______ là nền dân chủ cao hơn về chất so với nền dân chủ có trong lịch sử nhân loại. → Dân chủ xã hội chủ nghĩa","Nền dân chủ chủ nô, gắn với chế độ ______. → Chiếm hữu nô lệ"]},{"id":32,"title":"Câu 32. Căn cứ vào tính chất của quyền lực nhà nước, chức năng của nhà nước được chia thành:","options":[{"text":"A. Chức năng giai cấp và chức năng đối ngoại","correct":false},{"text":"B. Chức năng chính trị, kinh tế, văn hóa, xã hội","correct":false},{"text":"C. Chức năng giai cấp (trấn áp) và chức năng xã hội (tổ chức và xây dựng)","correct":true}],"lines":[]},{"id":33,"title":"Câu 33. Kéo thả (đáp án cho sẵn: dân chủ gián tiếp; dân chủ trực tiếp; dân chủ nhân dân):","options":[],"lines":["Hình thức ______ là hình thức dân chủ đại diện, được thực hiện do nhân dân “ủy quyền”, giao quyền lực của mình cho tổ chức mà nhân dân trực tiếp bầu ra. → Dân chủ gián tiếp","Hình thức ______ là hình thức thông qua đó, nhân dân bằng hành động trực tiếp của mình thực hiện quyền làm chủ nhà nước và xã hội. → Dân chủ trực tiếp","Chế độ ______ ở nước ta được xác lập sau Cách mạng Tháng Tám năm 1945. → Dân chủ nhân dân"]},{"id":34,"title":"Câu 34. Kéo thả (đáp án cho sẵn: Bầu cử Quốc hội; Thượng tôn pháp luật; Chủ thể quyền lực; Dân chủ đại diện):","options":[],"lines":["Dân chủ đại diện được thể hiện qua việc ______. → Bầu cử Quốc hội","Một nguyên tắc cốt lõi của nhà nước pháp quyền là ______. → Thượng tôn pháp luật","Nhân dân là ______ tối cao trong Nhà nước pháp quyền. → Chủ thể quyền lực","Hình thức dân chủ gián tiếp là hình thức ______. → Dân chủ đại diện"]},{"id":35,"title":"Câu 35. Kéo thả (đáp án cho sẵn: dân chủ gián tiếp; dân chủ trực tiếp; giai cấp công nhân; quyền làm chủ):","options":[],"lines":["Dân chủ XHCN là sự kết hợp giữa hình thức dân chủ đại diện và ______. → dân chủ trực tiếp","Nền dân chủ XHCN là nền dân chủ mang bản chất của ______. → giai cấp công nhân","Dân chủ XHCN bảo đảm phát huy đầy đủ ______ của nhân dân trên tất cả các lĩnh vực. → quyền làm chủ"]},{"id":36,"title":"Câu 36. Bản chất dân chủ XHCN ở Việt Nam được thực hiện thông qua các hình thức dân chủ nào? (Chọn 2 đáp án)","options":[{"text":"A. Dân chủ chuyên chế","correct":false},{"text":"B. Dân chủ trực tiếp","correct":true},{"text":"C. Dân chủ tuyệt đối","correct":false},{"text":"D. Dân chủ gián tiếp","correct":true}],"lines":[]},{"id":37,"title":"Câu 37. Bản chất của dân chủ là gì? (Chọn 2 đáp án)","options":[{"text":"A. Phân biệt rõ ràng các tầng lớp xã hội","correct":false},{"text":"B. Quyền lực thuộc về một nhóm nhỏ trong xã hội","correct":false},{"text":"C. Tôn trọng và đảm bảo quyền con người","correct":true},{"text":"D. Quyền lực thuộc về toàn thể nhân dân","correct":true}],"lines":[]},{"id":38,"title":"Câu 38. Chỉ ra luận điểm không chính xác:","options":[{"text":"A. Chủ nghĩa xã hội và chủ nghĩa tư bản khác nhau về chất, cần có một thời kỳ lịch sử nhất định để chuyển đổi.","correct":false},{"text":"B. Tất cả các quan hệ xã hội của chủ nghĩa xã hội tự nảy sinh trong lòng chủ nghĩa tư bản.","correct":true},{"text":"C. Công việc xây dựng chủ nghĩa xã hội là một công việc mới mẻ, khó khăn và phức tạp, phải có thời gian để giai cấp công nhân từng bước làm quen.","correct":false},{"text":"D. Thời kỳ quá độ là cần thiết để xây dựng cơ sở vật chất – kỹ thuật cho chủ nghĩa xã hội.","correct":false}],"lines":[]},{"id":39,"title":"Câu 39. So sánh sự khác nhau giữa giai đoạn thấp và giai đoạn cao của hình thái kinh tế - xã hội cộng sản chủ nghĩa?","options":[{"text":"A. Giai đoạn thấp thực hiện phân phối theo nhu cầu, giai đoạn cao thực hiện phân phối theo lao động","correct":false},{"text":"B. Giai đoạn thấp sử dụng pháp quyền tư sản","correct":false},{"text":"C. Giai đoạn thấp thực hiện phân phối theo lao động, giai đoạn cao thực hiện phân phối theo nhu cầu","correct":true},{"text":"D. Giai đoạn thấp không có sự phân chia giai cấp","correct":false}],"lines":[]},{"id":40,"title":"Câu 40. Chọn phương án đúng về mối quan hệ giữa dân chủ XHCN và nhà nước XHCN:","options":[{"text":"A. Dân chủ XHCN là mục đích cho việc xây dựng và hoạt động của nhà nước XHCN, còn nhà nước XHCN là điều kiện cho sự ra đời của dân chủ XHCN","correct":false},{"text":"B. Dân chủ XHCN là cơ sở, nền tảng cho việc xây dựng và hoạt động của nhà nước XHCN, còn nhà nước XHCN là công cụ quan trọng cho việc thực thi quyền làm chủ của người dân","correct":true},{"text":"C. Dân chủ XHCN là mục tiêu cho việc xây dựng và hoạt động của nhà nước XHCN, còn nhà nước XHCN là công cụ quan trọng cho việc thực thi quyền làm chủ của người dân","correct":false},{"text":"D. Dân chủ XHCN là mục đích cho việc xây dựng và hoạt động của nhà nước XHCN, còn nhà nước XHCN quyết định bản chất của dân chủ","correct":false}],"lines":[]},{"id":41,"title":"Câu 41. Chọn Đúng/Sai:","options":[],"lines":["Bản chất dân chủ XHCN ở Việt Nam được thực hiện thông qua các hình thức dân chủ gián tiếp và dân chủ trực tiếp. → Đúng","Đảng ta khẳng định một trong những đặc trưng của CNXH Việt Nam là do nhân dân làm chủ. → Đúng","Trong hoạt động của Nhà nước pháp quyền XHCN ở Việt Nam, các cơ quan của Nhà nước không được phân quyền rõ ràng. → Sai","Quốc hội là cơ quan quyền lực nhà nước cao nhất hoạt động theo nhiệm kỳ 3 năm. → Sai (nhiệm kỳ 5 năm)"]},{"id":42,"title":"Câu 42. Chọn Đúng/Sai:","options":[],"lines":["Dân chủ tư sản là hình thức dân chủ gắn với quyền lực chính trị của giai cấp tư sản. → Đúng","Nền dân chủ chủ nô gắn với chế độ chiếm hữu nô lệ. → Đúng","Dân chủ XHCN là công cụ để giai cấp công nhân thực hiện chuyên chính với các giai cấp khác. → Sai","Trong lịch sử nhân loại, cho đến nay có năm nền (chế độ) dân chủ. → Sai"]},{"id":43,"title":"Câu 43. Chọn Đúng/Sai:","options":[],"lines":["Năm 1976, tên nước được đổi thành Cộng hòa xã hội chủ nghĩa Việt Nam. → Đúng","Chế độ dân chủ nhân dân ở nước ta được xác lập sau Cách mạng Tháng Tám năm 1945. → Đúng","Hình thức dân chủ trực tiếp là hình thức dân chủ đại diện, được thực hiện do nhân dân “ủy quyền”. → Sai","Hình thức dân chủ gián tiếp là hình thức nhân dân bằng hành động trực tiếp của mình thực hiện quyền làm chủ. → Sai"]},{"id":44,"title":"Câu 44. Việc thực hiện chế độ công hữu về tư liệu sản xuất chủ yếu và phân phối lợi ích theo kết quả lao động là chủ yếu là bản chất kinh tế của nền dân chủ nào?","options":[{"text":"A. Nền dân chủ nguyên thủy","correct":false},{"text":"B. Nền dân chủ chủ nô","correct":false},{"text":"C. Nền dân chủ tư sản","correct":false},{"text":"D. Nền dân chủ xã hội chủ nghĩa","correct":true}],"lines":[]},{"id":45,"title":"Câu 45. Vì sao giai cấp công nhân Việt Nam sớm trở thành lực lượng chính trị độc lập và giữ vai trò lãnh đạo Cách mạng Việt Nam?","options":[{"text":"A. Vì sớm hình thành một chính đảng thực sự cách mạng","correct":true},{"text":"B. Vì có số lượng đông và luôn đi đầu trong cuộc đấu tranh","correct":false},{"text":"C. Vì được kế thừa truyền thống bất khuất của dân tộc","correct":false},{"text":"D. Vì sớm có mối quan hệ gắn bó với nông dân","correct":false}],"lines":[]},{"id":46,"title":"Câu 46. Những điều kiện khách quan quy định sứ mệnh lịch sử của giai cấp công nhân bao gồm: (Chọn nhiều đáp án)","options":[{"text":"A. Địa vị kinh tế - xã hội","correct":true},{"text":"B. Đặc điểm chính trị - xã hội","correct":true},{"text":"C. Giai cấp có lực lượng đông đảo","correct":false},{"text":"D. Do sự phát triển của lực lượng sản xuất hiện đại","correct":false}],"lines":[]},{"id":47,"title":"Câu 47. Nội dung cơ bản nhất mà nhờ đó chủ nghĩa xã hội từ không tưởng trở thành khoa học?","options":[{"text":"A. Phát hiện ra giai cấp công nhân là lực lượng xã hội có thể thủ tiêu chủ nghĩa tư bản, xây dựng chủ nghĩa xã hội","correct":true},{"text":"B. Lên án mạnh mẽ chủ nghĩa tư bản","correct":false},{"text":"C. Chỉ ra sự cần thiết phải thay thế chủ nghĩa tư bản bằng chủ nghĩa xã hội","correct":false},{"text":"D. Phản ánh đúng khát vọng của nhân dân lao động bị áp bức","correct":false}],"lines":[]},{"id":48,"title":"Câu 48. Ghép các đáp án (cho sẵn: Phương thức sản xuất; Lực lượng sản xuất; Chủ thể; Nhân tố chủ quan):","options":[],"lines":["Giai cấp công nhân đại diện cho ______ hiện đại. → Lực lượng sản xuất","Giai cấp công nhân đại diện cho ______ tiên tiến. → Phương thức sản xuất","Giai cấp công nhân là ______ của quá trình sản xuất vật chất hiện đại. → Chủ thể","Đảng Cộng sản là ______ quan trọng nhất để giai cấp công nhân thực hiện thắng lợi sứ mệnh lịch sử của mình. → Nhân tố chủ quan"]},{"id":49,"title":"Câu 49. So với các giai cấp khác thì sứ mệnh lịch sử của giai cấp công nhân có gì khác biệt?","options":[{"text":"A. Không có gì khác biệt","correct":false},{"text":"B. Xóa bỏ triệt để chế độ tư hữu về tư liệu sản xuất","correct":true},{"text":"C. Thay thế chế độ sở hữu này bằng một chế độ sở hữu khác","correct":false},{"text":"D. Duy trì chế độ tư hữu về tư liệu sản xuất","correct":false}],"lines":[]},{"id":50,"title":"Câu 50. Theo chủ nghĩa Mác – Lênin, có mấy hình thức quá độ lên chủ nghĩa xã hội?","options":[{"text":"A. 2","correct":true},{"text":"B. 4","correct":false},{"text":"C. 3","correct":false},{"text":"D. 1","correct":false}],"lines":[]},{"id":51,"title":"Câu 51. Xã hội xã hội chủ nghĩa ở Việt Nam là xã hội:","options":[{"text":"A. Do giai cấp nông dân làm chủ","correct":false},{"text":"B. Do nhân dân làm chủ","correct":true},{"text":"C. Do giai cấp công nhân làm chủ","correct":false},{"text":"D. Do nhân dân lao động làm chủ","correct":false}],"lines":[]},{"id":52,"title":"Câu 52. Ai được coi là \"dân\" trong nền dân chủ chủ nô? (Đã sửa: file free chọn \"giai cấp nông nô\")","options":[{"text":"A. Giai cấp chủ nô và các công dân tự do","correct":true},{"text":"B. Không ai cả","correct":false},{"text":"C. Nô lệ","correct":false},{"text":"D. Giai cấp nông nô","correct":false}],"lines":[]},{"id":53,"title":"Câu 53. Chọn Đúng/Sai: (Ý 1 đã sửa)","options":[],"lines":["Dân chủ XHCN là công cụ để giai cấp công nhân thực hiện chuyên chính với các giai cấp khác. → Sai","Nền dân chủ chủ nô gắn với chế độ chiếm hữu nô lệ. → Đúng","Dân chủ tư sản là hình thức dân chủ gắn với quyền lực chính trị của giai cấp tư sản. → Đúng","Trong lịch sử nhân loại, cho đến nay có năm nền (chế độ) dân chủ. → Sai"]},{"id":54,"title":"Câu 54. Chọn Đúng/Sai:","options":[],"lines":["Hình thức dân chủ gián tiếp là hình thức nhân dân bằng hành động trực tiếp của mình thực hiện quyền làm chủ nhà nước và xã hội. → Sai","Hình thức dân chủ trực tiếp là hình thức dân chủ đại diện, được thực hiện do nhân dân “ủy quyền”, giao quyền lực cho tổ chức mà nhân dân trực tiếp bầu ra. → Sai","Chế độ dân chủ nhân dân ở nước ta được xác lập sau Cách mạng Tháng Tám năm 1945. → Đúng","Năm 1976, tên nước được đổi thành Cộng hòa xã hội chủ nghĩa Việt Nam. → Đúng"]},{"id":55,"title":"Câu 55. Đâu là quan niệm đúng và đầy đủ về nhà nước xã hội chủ nghĩa ở Việt Nam?","options":[{"text":"A. Nhà nước không có sự can thiệp của Đảng Cộng sản, mục tiêu chỉ là phát triển kinh tế tư nhân và thu hút đầu tư nước ngoài","correct":false},{"text":"B. Nhà nước quân chủ lập hiến, quyền lực tập trung vào tay một người đứng đầu nhà nước","correct":false},{"text":"C. Nhà nước được lãnh đạo bởi tầng lớp tư sản, nhằm thúc đẩy kinh tế thị trường và phát triển doanh nghiệp tư nhân","correct":false},{"text":"D. Nhà nước của nhân dân, do nhân dân và vì nhân dân, dưới sự lãnh đạo của Đảng Cộng sản Việt Nam, nhằm xây dựng xã hội công bằng, dân chủ, văn minh","correct":true}],"lines":[]},{"id":56,"title":"Câu 56  Chọn Đúng/Sai:","options":[],"lines":["Đặc điểm cơ bản của thời kỳ quá độ lên CNXH là thời kỳ cải tạo cách mạng sâu sắc, triệt để trên lĩnh vực kinh tế. → Sai","Trong thời kỳ quá độ từ CNTB lên CNXH tồn tại nhiều giai cấp, tầng lớp. → Đúng","Trong thời kỳ quá độ từ CNTB lên CNXH tồn tại nền kinh tế nhiều thành phần. → Đúng","Trong thời kỳ quá độ từ CNTB lên CNXH tồn tại chủ yếu là tư tưởng vô sản. → Sai"]},{"id":57,"title":"Câu 57  Kéo thả:","options":[],"lines":["Quá độ lên CNXH bỏ qua chế độ TBCN là con đường cách mạng ______. → Tất yếu khách quan","Bỏ qua việc xác lập ______ của quan hệ sản xuất và kiến trúc thượng tầng TBCN. → Vị trí thống trị (file free ghi nhầm \"vị trí thống nhất\")","Việt Nam thực hiện ______ đi lên CNXH. → Quá độ gián tiếp"]}],"notes":[]},{"id":4,"name":"Bài 4 – Cơ cấu xã hội – giai cấp và liên minh giai cấp, tầng lớp","questions":[{"id":1,"title":"Câu 1. Trong thời kỳ quá độ lên CNXH, cơ cấu xã hội – giai cấp thường xuyên biến đổi theo mấy quy luật cơ bản?","options":[{"text":"A. 5","correct":false},{"text":"B. 3","correct":true},{"text":"C. 4","correct":false},{"text":"D. 2","correct":false}],"lines":[]},{"id":2,"title":"Câu 2. Xét về mặt kinh tế, trong thời kỳ quá độ lên CNXH, cơ cấu xã hội – giai cấp biến đổi phức tạp, đa dạng, làm xuất hiện các tầng lớp mới là do:","options":[{"text":"A. Kinh tế chậm phát triển","correct":false},{"text":"B. Các giai cấp có nhiều tư liệu sản xuất quyết định","correct":false},{"text":"C. Tồn tại nhiều giai cấp, tầng lớp","correct":false},{"text":"D. Cơ cấu kinh tế đa dạng, phức tạp","correct":true}],"lines":[]},{"id":3,"title":"Câu 3. V.I. Lênin đã xem liên minh giữa giai cấp, tầng lớp nào là một hình thức “liên minh đặc biệt” trong giai đoạn giành chính quyền và xây dựng CNXH?","options":[{"text":"A. Giai cấp công nhân với tầng lớp trí thức và doanh nhân","correct":false},{"text":"B. Giai cấp công nhân với giai cấp nông dân và các tầng lớp xã hội khác","correct":true},{"text":"C. Giai cấp công nhân với giai cấp nông dân và tầng lớp trí thức","correct":false},{"text":"D. Giai cấp công nhân với giai cấp nông dân và tầng lớp tiểu tư sản","correct":false}],"lines":[]},{"id":4,"title":"Câu 4. Trong cách mạng XHCN, dưới sự lãnh đạo của Đảng Cộng sản, giai cấp công nhân phải liên minh với giai cấp, tầng lớp nào?","options":[{"text":"A. Giai cấp vô sản đại công nghiệp","correct":false},{"text":"B. Giai cấp tư sản","correct":false},{"text":"C. Giai cấp vô sản","correct":false},{"text":"D. Giai cấp nông dân và các tầng lớp nhân dân lao động","correct":true}],"lines":[]},{"id":5,"title":"Câu 5. Xét dưới góc độ chính trị, trong cuộc đấu tranh giai cấp của các giai cấp có lợi ích đối lập nhau, mỗi giai cấp đứng ở vị trí trung tâm đều phải:","options":[{"text":"A. Liên minh với các giai cấp, tầng lớp khác mà giai cấp đứng ở vị trí trung tâm được lợi nhiều hơn","correct":false},{"text":"B. Liên minh với các giai cấp, tầng lớp khác có những lợi ích đối lập với mình","correct":false},{"text":"C. Liên minh với các giai cấp, tầng lớp khác có tiềm lực kinh tế lớn hơn mình","correct":false},{"text":"D. Liên minh với các giai cấp, tầng lớp khác có những lợi ích phù hợp với mình","correct":true}],"lines":[]},{"id":6,"title":"Câu 6. Điền vào chỗ trống: “Trước sự liên minh của các đại biểu khoa học ..., giới kỹ thuật không một thế lực đen tối nào đứng vững được.”","options":[{"text":"A. Giai cấp tiểu tư sản","correct":false},{"text":"B. Giai cấp vô sản","correct":true},{"text":"C. Giai cấp nông dân","correct":false},{"text":"D. Giai cấp tư sản","correct":false}],"lines":[]},{"id":7,"title":"Câu 7. Nội dung kinh tế của liên minh giai cấp, tầng lớp trong thời kỳ quá độ lên CNXH ở Việt Nam là gì?","options":[{"text":"A. Giữ vững lập trường tư tưởng của giai cấp công nhân, giữ vững vai trò lãnh đạo của Đảng","correct":false},{"text":"B. Tăng cường phát triển kinh tế kết hợp với phát triển quân sự gắn với phát triển ngoại giao","correct":false},{"text":"C. Đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước gắn với phát triển kinh tế tri thức, phát triển bền vững","correct":true},{"text":"D. Xây dựng nền văn hóa tiên tiến, đậm đà bản sắc dân tộc, đồng thời tiếp thu những tinh hoa, giá trị văn hóa của nhân loại và thời đại","correct":false}],"lines":[]},{"id":8,"title":"Câu 8. Theo C. Mác và Ph. Ăngghen, nhiều cuộc đấu tranh của giai cấp công nhân ở châu Âu, nhất là ở Anh và Pháp từ giữa thế kỷ XIX thất bại là do:","options":[{"text":"A. Không tổ chức liên minh với tầng lớp tiểu chủ","correct":false},{"text":"B. Không tổ chức liên minh với giai cấp nông dân","correct":true},{"text":"C. Không tổ chức liên minh với tầng lớp trí thức","correct":false},{"text":"D. Không tổ chức liên minh với giai cấp tư sản","correct":false}],"lines":[]},{"id":9,"title":"Câu 9. Theo quan điểm của chủ nghĩa Mác – Lênin, trong thời kỳ quá độ lên CNXH, giai cấp công nhân, giai cấp nông dân và tầng lớp lao động khác được coi là:","options":[{"text":"A. Lực lượng kém phát triển","correct":false},{"text":"B. Lực lượng sản xuất cơ bản, lực lượng chính trị – xã hội to lớn","correct":true},{"text":"C. Lực lượng vũ trang cơ bản","correct":false},{"text":"D. Lực lượng ngoại giao to lớn","correct":false}],"lines":[]},{"id":10,"title":"Câu 10. Trong thời kỳ quá độ lên CNXH, cơ cấu xã hội – giai cấp gồm mấy giai cấp, tầng lớp cơ bản?","options":[{"text":"A. 5","correct":false},{"text":"B. 6","correct":true},{"text":"C. 4","correct":false},{"text":"D. 3","correct":false}],"lines":["Cần xác nhận: bản trước in đậm 3 nhưng ghi chú cuối bài chọn 5. Ba tệp mới không có câu tương ứng và không xác minh được con số. Giữ 3 theo đáp án gốc, không coi đây là đáp án đã kiểm chứng."]},{"id":11,"title":"Câu 11. Trong thời kỳ quá độ lên CNXH ở Việt Nam, giai cấp nào là lực lượng đi đầu thực hiện nhiệm vụ trung tâm phát triển kinh tế, tiến hành công nghiệp hóa, hiện đại hóa đất nước? (Đã sửa: file 30k chọn \"giai cấp nông dân\")","options":[{"text":"A. Đội ngũ trí thức","correct":false},{"text":"B. Giai cấp nông dân","correct":false},{"text":"C. Giai cấp công nhân","correct":true},{"text":"D. Đội ngũ doanh nhân","correct":false}],"lines":[]},{"id":12,"title":"Câu 12. Chọn ý sai về nội dung kinh tế của liên minh giữa giai cấp công nhân với giai cấp nông dân và các tầng lớp lao động khác trong cách mạng XHCN:","options":[{"text":"A. Thực hiện hợp đồng kinh tế giữa doanh nghiệp nhà nước và nông dân","correct":false},{"text":"B. Xây dựng hệ thống chính sách an sinh xã hội","correct":true},{"text":"C. Ứng dụng khoa học kỹ thuật vào sản xuất nông nghiệp","correct":false},{"text":"D. Xây dựng hệ thống chính sách phát triển nông nghiệp, nông dân, nông thôn","correct":false}],"lines":[]},{"id":13,"title":"Câu 13. Trong cơ cấu xã hội – giai cấp của thời kỳ quá độ lên CNXH, lực lượng tiêu biểu cho phương thức sản xuất mới, giữ vai trò chủ đạo, tiên phong trong quá trình công nghiệp hóa, hiện đại hóa đất nước là:","options":[{"text":"A. Giai cấp nông dân","correct":false},{"text":"B. Đội ngũ doanh nhân","correct":false},{"text":"C. Tầng lớp trí thức","correct":false},{"text":"D. Giai cấp công nhân","correct":true}],"lines":[]},{"id":14,"title":"Câu 14. Nội dung cơ bản quyết định nhất, là cơ sở vật chất – kỹ thuật của liên minh giai cấp, tầng lớp trong thời kỳ quá độ lên CNXH ở Việt Nam là nội dung nào?","options":[{"text":"A. Nội dung kinh tế của liên minh","correct":true},{"text":"B. Nội dung văn hóa của liên minh","correct":false},{"text":"C. Nội dung chính trị của liên minh","correct":false},{"text":"D. Nội dung xã hội của liên minh","correct":false}],"lines":[]},{"id":15,"title":"Câu 15. Vì sao cơ cấu xã hội – giai cấp có vị trí quan trọng hàng đầu, chi phối các loại hình cơ cấu xã hội khác? (Chọn 2 đáp án)","options":[{"text":"A. Vì cơ cấu xã hội – giai cấp liên quan đến các đảng phái chính trị và nhà nước; đến quyền sở hữu tư liệu sản xuất","correct":true},{"text":"B. Vì cơ cấu xã hội – giai cấp liên quan đến nhiều giai cấp giàu có trong xã hội","correct":false},{"text":"C. Vì cơ cấu xã hội – giai cấp liên quan đến các tổ chức tà đạo, các băng nhóm xã hội đen lớn trong xã hội","correct":false},{"text":"D. Vì cơ cấu xã hội – giai cấp liên quan đến quản lý tổ chức lao động, vấn đề phân phối thu nhập","correct":true}],"lines":[]},{"id":16,"title":"Câu 16. Dưới góc độ chính trị – xã hội, môn Chủ nghĩa xã hội khoa học tập trung nghiên cứu cơ cấu xã hội nào?","options":[{"text":"A. Cơ cấu xã hội – giai cấp","correct":true},{"text":"B. Cơ cấu xã hội – nghề nghiệp","correct":false},{"text":"C. Cơ cấu xã hội – dân cư","correct":false},{"text":"D. Cơ cấu xã hội – dân tộc","correct":false}],"lines":[]},{"id":17,"title":"Câu 17. Trong thời kỳ quá độ lên CNXH ở Việt Nam, sự biến đổi của cơ cấu xã hội – giai cấp bị chi phối bởi biến đổi của cơ cấu nào?","options":[{"text":"A. Cơ cấu kinh tế","correct":true},{"text":"B. Cơ cấu xã hội – dân cư","correct":false},{"text":"C. Cơ cấu xã hội – dân tộc","correct":false},{"text":"D. Cơ cấu xã hội – tôn giáo","correct":false}],"lines":[]},{"id":18,"title":"Câu 18. Theo V.I. Lênin, đâu là vấn đề mang tính nguyên tắc để đảm bảo cho thắng lợi của Cách mạng XHCN Tháng Mười Nga năm 1917?","options":[{"text":"A. Liên minh giữa giai cấp vô sản và nông dân","correct":true},{"text":"B. Liên minh công, nông và trí thức","correct":false},{"text":"C. Liên minh giữa giai cấp công nhân, tầng lớp tư sản tiến bộ","correct":false},{"text":"D. Liên minh giữa giai cấp công nhân, tầng lớp tiểu tư sản","correct":false}],"lines":[]},{"id":19,"title":"Câu 19. Cơ cấu xã hội – giai cấp ở Việt Nam thời kỳ quá độ lên CNXH bao gồm mấy giai cấp, tầng lớp?","options":[{"text":"A. 4","correct":true},{"text":"B. 6","correct":false},{"text":"C. 3","correct":false},{"text":"D. 5","correct":false}],"lines":[]},{"id":20,"title":"Câu 20. Trong thời kỳ quá độ lên CNXH, cơ cấu xã hội – giai cấp biến đổi trong mối quan hệ nào?","options":[{"text":"A. Vừa thống nhất, vừa bình đẳng với nhau","correct":false},{"text":"B. Vừa liên minh, cấu kết các giai cấp, tầng lớp quy mô lớn để đàn áp các giai cấp, tầng lớp quy mô nhỏ","correct":false},{"text":"C. Vừa đấu tranh, vừa liên minh, từng bước xóa bỏ bất bình đẳng xã hội dẫn đến sự xích lại gần nhau","correct":true},{"text":"D. Vừa đấu tranh, vừa bài xích lẫn nhau","correct":false}],"lines":[]},{"id":21,"title":"Câu 21. Lực lượng nào là lực lượng lao động sáng tạo đặc biệt quan trọng trong tiến trình đẩy mạnh công nghiệp hóa, hiện đại hóa, hội nhập quốc tế, xây dựng kinh tế tri thức, phát triển nền văn hóa Việt Nam tiên tiến, đậm đà bản sắc dân tộc?","options":[{"text":"A. Nông dân","correct":false},{"text":"B. Công nhân","correct":false},{"text":"C. Trí thức","correct":true},{"text":"D. Thanh niên","correct":false}],"lines":[]},{"id":22,"title":"Câu 22. Trong cơ cấu xã hội của thời kỳ quá độ lên CNXH, cơ cấu xã hội nào giữ vị trí quan trọng hàng đầu, chi phối các loại hình cơ cấu xã hội khác?","options":[{"text":"A. Cơ cấu xã hội – dân tộc","correct":false},{"text":"B. Cơ cấu xã hội – giai cấp","correct":true},{"text":"C. Cơ cấu xã hội – nghề nghiệp","correct":false},{"text":"D. Cơ cấu xã hội – tôn giáo","correct":false}],"lines":[]},{"id":23,"title":"Câu 23. Mục tiêu chính của việc giáo dục chính trị, tư tưởng cho thanh niên trong giai đoạn hiện nay ở Việt Nam là gì?","options":[{"text":"A. Để kiểm soát các hoạt động kinh tế của thanh niên","correct":false},{"text":"B. Để hình thành thế hệ thanh niên có phẩm chất tốt đẹp, có khí phách và quyết tâm hành động","correct":true},{"text":"C. Để giảm thiểu sự tham gia của thanh niên vào các hoạt động xã hội","correct":false},{"text":"D. Để tăng cường quyền lực của nhà nước","correct":false}],"lines":[]},{"id":24,"title":"Câu 24. Hiện nay ở Việt Nam, lực lượng xã hội đặc biệt được Đảng ta chủ trương xây dựng thành một đội ngũ vững mạnh là: (Đã sửa: file free lần 1 chọn \"Thanh niên\")","options":[{"text":"A. Thanh niên","correct":false},{"text":"B. Công nhân","correct":false},{"text":"C. Trí thức","correct":false},{"text":"D. Doanh nhân","correct":true}],"lines":[]},{"id":25,"title":"Câu 25. Theo C. Mác – Ph. Ăngghen, “người bạn đồng minh tự nhiên” của giai cấp công nhân là ai?","options":[{"text":"A. Nhân dân lao động","correct":false},{"text":"B. Giai cấp nông dân","correct":true},{"text":"C. Tầng lớp trí thức","correct":false},{"text":"D. Đội ngũ doanh nhân","correct":false}],"lines":[]},{"id":26,"title":"Câu 26. Vì sao giai cấp công nhân, nông dân và đội ngũ trí thức cần liên minh với nhau trong thời kỳ quá độ lên CNXH? (Chọn 2 đáp án)","options":[{"text":"A. Vì giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức có sự thống nhất chung về lợi ích","correct":true},{"text":"B. Vì các giai cấp, tầng lớp muốn có đông lực lượng để tổ chức các hoạt động văn hóa, xã hội","correct":false},{"text":"C. Vì giai cấp công nhân bắt buộc các giai cấp nông dân, tầng lớp trí thức liên minh với mình","correct":false},{"text":"D. Vì xuất phát từ yêu cầu khách quan của quá trình đẩy mạnh công nghiệp hóa, hiện đại hóa và chuyển dịch cơ cấu kinh tế từ một nền sản xuất nhỏ, nông nghiệp là chủ yếu sang sản xuất hàng hóa lớn","correct":true}],"lines":[]},{"id":27,"title":"Câu 27. Nội dung chính trị của liên minh giai cấp, tầng lớp trong thời kỳ quá độ lên CNXH ở Việt Nam thể hiện việc giữ vững lập trường chính trị – tư tưởng của giai cấp, tầng lớp nào?","options":[{"text":"A. Giai cấp nông dân","correct":false},{"text":"B. Giai cấp công nhân","correct":true},{"text":"C. Giai cấp tư sản","correct":false},{"text":"D. Tầng lớp trí thức","correct":false}],"lines":[]},{"id":28,"title":"Câu 28. Điền vào chỗ trống: “Cơ cấu xã hội là những ... cùng toàn bộ những mối quan hệ xã hội do sự tác động lẫn nhau của các cộng đồng ấy tạo nên.”","options":[{"text":"A. Cộng đồng dân tộc","corr
